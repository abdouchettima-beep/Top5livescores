<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 5 Leagues - Live Scores</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    background:linear-gradient(90deg,#16a56b,#1599ff);
    text-align:center;
    padding:11px 5px;
    font-size:17px;
    font-weight:bold;
}

.ad{
    width:300px;
    height:60px;
    margin:12px auto;
    background:#202020;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:11px;
}

.setup{
    background:#171717;
    margin:10px auto;
    padding:15px;
    max-width:700px;
    border-radius:10px;
    text-align:center;
}

.setup input{
    width:90%;
    max-width:500px;
    padding:12px;
    border-radius:7px;
    border:1px solid #444;
    background:#222;
    color:white;
    margin:8px 0;
}

button{
    border:0;
    border-radius:20px;
    padding:10px 16px;
    margin:4px;
    background:#303030;
    color:white;
    font-weight:bold;
}

button.active{
    background:#168cf5;
}

button:hover{
    opacity:.9;
}

.leagues{
    display:flex;
    overflow-x:auto;
    padding:5px;
    gap:4px;
    white-space:nowrap;
}

.leagues button{
    font-size:12px;
}

.controls{
    text-align:center;
    margin:8px;
}

.content{
    max-width:900px;
    margin:auto;
    padding:5px;
}

.title{
    text-align:center;
    font-size:18px;
    margin:15px 0 10px;
}

.message{
    background:#1b1b1b;
    padding:20px;
    text-align:center;
    border-radius:8px;
    margin:10px 0;
}

.error{
    background:#421818;
    border:1px solid #8d3030;
    color:#ffaaaa;
    padding:15px;
    border-radius:8px;
    margin:10px 0;
    word-break:break-word;
}

.match{
    background:#1c1c1c;
    margin:8px 0;
    border-radius:9px;
    padding:12px;
    border-left:4px solid #168cf5;
}

.league-name{
    color:#26a5ff;
    font-weight:bold;
    font-size:13px;
}

.country{
    color:#999;
    font-size:12px;
    margin-top:3px;
}

.time{
    text-align:center;
    color:#ffd42a;
    font-weight:bold;
    margin:8px 0;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.team{
    width:40%;
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:bold;
}

.team.away{
    justify-content:flex-end;
    text-align:right;
}

.team img{
    width:25px;
    height:25px;
    object-fit:contain;
}

.score{
    font-size:18px;
    font-weight:bold;
    min-width:55px;
    text-align:center;
}

.status{
    text-align:center;
    margin-top:8px;
    color:#00e676;
    font-size:13px;
}

.stadium{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:8px;
}

.section-tabs{
    text-align:center;
    margin:8px 0;
}

.small{
    font-size:11px;
    color:#888;
    text-align:center;
}

.hidden{
    display:none;
}

.loading{
    text-align:center;
    padding:25px;
    color:#aaa;
}

@media(max-width:500px){

    .team{
        font-size:13px;
    }

    .score{
        font-size:16px;
    }

    .header{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="header">
    ⚽ Top 5 Leagues - Live Scores
</div>

<div class="ad">
    AdMob Banner
</div>


<!-- API SETUP -->

<div class="setup" id="setupBox">

    <strong>⚙️ API-Football Setup</strong>

    <div class="small">
        Enter your API key once for testing.
    </div>

    <input
        type="password"
        id="apiKey"
        placeholder="Enter API-Football API key"
    >

    <br>

    <button onclick="saveApiKey()">
        🔐 Save & Load
    </button>

</div>


<!-- LEAGUES -->

<div class="leagues">

    <button
        id="league-all"
        class="active"
        onclick="selectLeague('all',this)">
        🌐 All
    </button>

    <button onclick="selectLeague(39,this)">
        🏴 Premier League
    </button>

    <button onclick="selectLeague(140,this)">
        🇪🇸 La Liga
    </button>

    <button onclick="selectLeague(135,this)">
        🇮🇹 Serie A
    </button>

    <button onclick="selectLeague(78,this)">
        🇩🇪 Bundesliga
    </button>

    <button onclick="selectLeague(61,this)">
        🇫🇷 Ligue 1
    </button>

    <button onclick="selectLeague(2,this)">
        🏆 Champions League
    </button>

</div>


<!-- STATUS TABS -->

<div class="section-tabs">

    <button
        id="liveBtn"
        class="active"
        onclick="changeMode('live',this)">
        🔴 Live
    </button>

    <button
        onclick="changeMode('upcoming',this)">
        📅 Upcoming
    </button>

    <button
        onclick="changeMode('finished',this)">
        ✅ Finished
    </button>

    <button onclick="loadData()">
        🔄 Refresh
    </button>

</div>


<div class="content">

    <div id="title" class="title">
        🔴 Live Matches
    </div>

    <div id="message"></div>

    <div id="matches"></div>

    <div class="small">
        LiveScore Football<br>
        Powered by API-Football
    </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const API_BASE =
    "https://v3.football.api-sports.io";

const TIMEZONE =
    "Africa/Lagos";


const LEAGUES = {

    39: "Premier League",
    140: "La Liga",
    135: "Serie A",
    78: "Bundesliga",
    61: "Ligue 1",
    2: "UEFA Champions League"

};


let API_KEY =
    localStorage.getItem("footballApiKey") || "";

let selectedLeague = "all";

let currentMode = "live";


/* =====================================================
   DATE
===================================================== */

function getDate(offset = 0){

    const now = new Date();

    now.setDate(
        now.getDate() + offset
    );

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:TIMEZONE,
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(now);
}


/* =====================================================
   SAVE API KEY
===================================================== */

function saveApiKey(){

    const input =
        document.getElementById("apiKey").value.trim();

    if(!input){

        showError(
            "Please enter your API key."
        );

        return;
    }

    API_KEY = input;

    localStorage.setItem(
        "footballApiKey",
        API_KEY
    );

    document.getElementById(
        "apiKey"
    ).value = "";

    loadData();
}


/* =====================================================
   INITIAL LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        if(API_KEY){

            document.getElementById(
                "setupBox"
            ).innerHTML = `
                <strong>✅ API Key Saved</strong>
                <div class="small">
                    Your API key is saved in this browser.
                </div>
            `;

            loadData();

        }else{

            showError(
                "API key not added. Enter your API key above."
            );

        }

    }
);


/* =====================================================
   CHANGE LEAGUE
===================================================== */

function selectLeague(
    league,
    button
){

    selectedLeague = league;

    document.querySelectorAll(
        ".leagues button"
    ).forEach(
        b => b.classList.remove("active")
    );

    button.classList.add("active");

    loadData();
}


/* =====================================================
   CHANGE MODE
===================================================== */

function changeMode(
    mode,
    button
){

    currentMode = mode;

    document.querySelectorAll(
        ".section-tabs button"
    ).forEach(
        b => b.classList.remove("active")
    );

    button.classList.add("active");

    const title =
        document.getElementById("title");

    if(mode === "live"){

        title.innerHTML =
            "🔴 Live Matches";

    }else if(mode === "upcoming"){

        title.innerHTML =
            "📅 Upcoming Matches";

    }else{

        title.innerHTML =
            "✅ Finished Matches";

    }

    loadData();
}


/* =====================================================
   MAIN LOADER
===================================================== */

async function loadData(){

    if(!API_KEY){

        showError(
            "API key not added."
        );

        return;
    }

    document.getElementById(
        "matches"
    ).innerHTML =
        `<div class="loading">
            ⏳ Loading matches...
         </div>`;

    document.getElementById(
        "message"
    ).innerHTML = "";


    try{

        let matches = [];


        /* =============================================
           LIVE
        ============================================= */

        if(currentMode === "live"){

            const data =
                await apiRequest(
                    "/fixtures?live=all"
                );

            matches =
                data.response || [];

        }


        /* =============================================
           TODAY FINISHED
        ============================================= */

        else if(
            currentMode === "finished"
        ){

            const date =
                getDate(0);

            const data =
                await apiRequest(
                    "/fixtures?date=" +
                    date +
                    "&timezone=" +
                    TIMEZONE
                );

            matches =
                data.response || [];

        }


        /* =============================================
           UPCOMING
        ============================================= */

        else{

            /*
             Get the next 7 days.
             This makes the app useful even when
             there are no matches today.
            */

            let allUpcoming = [];

            for(
                let i = 0;
                i < 7;
                i++
            ){

                const date =
                    getDate(i);

                const data =
                    await apiRequest(
                        "/fixtures?date=" +
                        date +
                        "&timezone=" +
                        TIMEZONE
                    );

                const dayMatches =
                    data.response || [];

                allUpcoming =
                    allUpcoming.concat(
                        dayMatches
                    );
            }

            matches =
                allUpcoming.filter(
                    match => {

                        const status =
                            match.fixture?.status?.short;

                        return [
                            "NS",
                            "TBD",
                            "PST"
                        ].includes(status);

                    }
                );

        }


        /* =============================================
           FILTER TOP 5 + CHAMPIONS LEAGUE
        ============================================= */

        matches =
            matches.filter(
                match => {

                    const id =
                        match.league?.id;

                    return Object.keys(
                        LEAGUES
                    ).includes(
                        String(id)
                    );

                }
            );


        /* =============================================
           FILTER SELECTED LEAGUE
        ============================================= */

        if(
            selectedLeague !== "all"
        ){

            matches =
                matches.filter(
                    match =>
                        String(
                            match.league?.id
                        ) ===
                        String(
                            selectedLeague
                        )
                );

        }


        /* =============================================
           FINISHED FILTER
        ============================================= */

        if(
            currentMode === "finished"
        ){

            matches =
                matches.filter(
                    match => {

                        const status =
                            match.fixture?.status?.short;

                        return [
                            "FT",
                            "AET",
                            "PEN"
                        ].includes(status);

                    }
                );

        }


        /* =============================================
           SORT
        ============================================= */

        matches.sort(
            (a,b) => {

                return new Date(
                    a.fixture.date
                ) -
                new Date(
                    b.fixture.date
                );

            }
        );


        /* =============================================
           DISPLAY
        ============================================= */

        displayMatches(
            matches
        );


    }catch(error){

        showError(
            error.message
        );

    }

}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(
    endpoint
){

    const response =
        await fetch(
            API_BASE + endpoint,
            {
                method:"GET",

                headers:{
                    "x-apisports-key":
                        API_KEY
                }
            }
        );


    let data;

    try{

        data =
            await response.json();

    }catch(e){

        throw new Error(
            "The API returned an invalid response."
        );

    }


    if(!response.ok){

        throw new Error(
            "API HTTP error " +
            response.status
        );

    }


    if(
        data.errors &&
        Object.keys(
            data.errors
        ).length
    ){

        throw new Error(
            JSON.stringify(
                data.errors
            )
        );

    }


    return data;
}


/* =====================================================
   DISPLAY MATCHES
===================================================== */

function displayMatches(
    matches
){

    const box =
        document.getElementById(
            "matches"
        );


    if(!matches.length){

        box.innerHTML = `
            <div class="message">
                <div style="font-size:25px">
                    ⚽
                </div>

                <br>

                No ${currentMode}
                matches found for this
                selection.

                <br><br>

                <button onclick="loadData()">
                    🔄 Try Again
                </button>
            </div>
        `;

        return;
    }


    let html = "";


    matches.forEach(
        match => {

            const league =
                match.league?.name ||
                "Unknown League";

            const country =
                match.league?.country ||
                "";

            const home =
                match.teams?.home;

            const away =
                match.teams?.away;


            const homeName =
                home?.name ||
                "Home";

            const awayName =
                away?.name ||
                "Away";


            const homeLogo =
                home?.logo || "";

            const awayLogo =
                away?.logo || "";


            const status =
                match.fixture?.status?.short ||
                "";


            const homeScore =
                match.goals?.home;

            const awayScore =
                match.goals?.away;


            const isUpcoming =
                [
                    "NS",
                    "TBD",
                    "PST"
                ].includes(status);


            let scoreText;


            if(isUpcoming){

                scoreText = "-";

            }else{

                scoreText =
                    `${homeScore ?? 0}
                     -
                     ${awayScore ?? 0}`;

            }


            const date =
                new Date(
                    match.fixture.date
                );


            const time =
                date.toLocaleTimeString(
                    "en-NG",
                    {
                        timeZone:
                            TIMEZONE,

                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


            const venue =
                match.fixture?.venue?.name ||
                "";


            let statusText =
                status;


            if(status === "1H")
                statusText =
                    "LIVE • 1st Half";

            if(status === "2H")
                statusText =
                    "LIVE • 2nd Half";

            if(status === "HT")
                statusText =
                    "HALF TIME";

            if(status === "ET")
                statusText =
                    "EXTRA TIME";

            if(status === "P")
                statusText =
                    "PENALTIES";

            if(status === "FT")
                statusText =
                    "FULL TIME";

            if(status === "NS")
                statusText =
                    "NOT STARTED";

            if(status === "PST")
                statusText =
                    "POSTPONED";


            html += `

                <div class="match">

                    <div class="league-name">
                        🏆 ${escapeHTML(league)}
                    </div>

                    <div class="country">
                        ${escapeHTML(country)}
                    </div>

                    ${
                        isUpcoming
                        ?
                        `<div class="time">
                            ⏰ ${time}
                         </div>`
                        :
                        ""
                    }


                    <div class="teams">

                        <div class="team">

                            ${
                                homeLogo
                                ?
                                `<img src="${homeLogo}"
                                      onerror="this.style.display='none'">`
                                :
                                ""
                            }

                            <span>
                                ${escapeHTML(homeName)}
                            </span>

                        </div>


                        <div class="score">

                            ${scoreText}

                        </div>


                        <div class="team away">

                            <span>
                                ${escapeHTML(awayName)}
                            </span>

                            ${
                                awayLogo
                                ?
                                `<img src="${awayLogo}"
                                      onerror="this.style.display='none'">`
                                :
                                ""
                            }

                        </div>

                    </div>


                    <div class="status">
                        ${escapeHTML(statusText)}
                    </div>


                    ${
                        venue
                        ?
                        `<div class="stadium">
                            🏟️ ${escapeHTML(venue)}
                         </div>`
                        :
                        ""
                    }

                </div>

            `;

        }
    );


    box.innerHTML = html;
}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    document.getElementById(
        "message"
    ).innerHTML = `

        <div class="error">

            ❌ <strong>API Error</strong>

            <br><br>

            ${escapeHTML(message)}

        </div>

    `;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
