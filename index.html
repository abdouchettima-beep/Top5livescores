<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Fixtures Test</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
}

.info{
    color:#aaa;
    text-align:center;
    margin-bottom:20px;
}

button{
    display:block;
    margin:15px auto;
    padding:14px 25px;
    border:0;
    border-radius:8px;
    background:#168af5;
    color:white;
    font-weight:bold;
    font-size:15px;
}

.success{
    background:#064d2b;
    padding:15px;
    border-radius:8px;
    color:#70ffad;
    margin:15px 0;
}

.error{
    background:#521616;
    padding:15px;
    border-radius:8px;
    color:#ff9999;
    margin:15px 0;
    word-break:break-word;
}

.match{
    background:#252525;
    margin:10px 0;
    padding:15px;
    border-radius:10px;
}

.league{
    color:#29a3ff;
    font-weight:bold;
}

.teams{
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

.status{
    color:#00e676;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Football Fixtures Test</h1>

<div class="info">
Testing fixtures for:
<strong id="date"></strong>
</div>

<button onclick="loadFixtures()">
LOAD TODAY'S MATCHES
</button>

<div id="result"></div>

</div>

<script>

/* =====================================================
   GET THE API KEY SAVED BY index.html
===================================================== */

const API_KEY =
    localStorage.getItem("footballApiKey") || "";


/* =====================================================
   TODAY'S DATE — NIGERIA TIME
===================================================== */

function getToday(){

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:"Africa/Lagos",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).formatToParts(new Date());

    const year =
        parts.find(p => p.type === "year").value;

    const month =
        parts.find(p => p.type === "month").value;

    const day =
        parts.find(p => p.type === "day").value;

    return `${year}-${month}-${day}`;
}

const TODAY = getToday();

document.getElementById("date").textContent = TODAY;


/* =====================================================
   LOAD FIXTURES
===================================================== */

async function loadFixtures(){

    const result =
        document.getElementById("result");

    result.innerHTML =
        `<div class="info">
            ⏳ Connecting to API-Football...
         </div>`;


    /* Check saved API key */

    if(!API_KEY){

        result.innerHTML = `
            <div class="error">
                ❌ API KEY NOT FOUND

                <br><br>

                Please go back to the main
                LiveScore page and enter your
                API key in the API box.

                <br><br>

                Then tap "Save & Load".
            </div>
        `;

        return;
    }


    try{

        const url =
            "https://v3.football.api-sports.io/fixtures" +
            "?date=" + TODAY +
            "&timezone=Africa/Lagos";


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:{
                        "x-apisports-key":API_KEY
                    }
                }
            );


        const data =
            await response.json();


        /* HTTP error */

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                JSON.stringify(data)
            );
        }


        /* API error */

        if(
            data.errors &&
            Object.keys(data.errors).length > 0
        ){

            throw new Error(
                JSON.stringify(data.errors)
            );
        }


        const matches =
            data.response || [];


        /* SUCCESS */

        let html = `
            <div class="success">
                ✅ FIXTURES API WORKING!

                <br><br>

                Matches received:
                <strong>${matches.length}</strong>
            </div>
        `;


        if(matches.length === 0){

            html += `
                <div class="error">
                    ⚠️ The API connection works,
                    but there are no fixtures returned
                    for ${TODAY}.
                </div>
            `;

            result.innerHTML = html;
            return;
        }


        /* Show first 50 fixtures */

        matches.slice(0,50).forEach(match => {

            const league =
                match.league?.name || "Unknown League";

            const country =
                match.league?.country || "";

            const home =
                match.teams?.home?.name || "Home";

            const away =
                match.teams?.away?.name || "Away";

            const homeScore =
                match.goals?.home ?? "-";

            const awayScore =
                match.goals?.away ?? "-";

            const status =
                match.fixture?.status?.short || "";


            html += `
                <div class="match">

                    <div class="league">
                        🏆 ${escapeHTML(league)}
                    </div>

                    <div style="color:#aaa;margin-top:3px">
                        ${escapeHTML(country)}
                    </div>

                    <div class="teams">
                        ${escapeHTML(home)}
                        ${homeScore}
                        -
                        ${awayScore}
                        ${escapeHTML(away)}
                    </div>

                    <div class="status">
                        Status: ${escapeHTML(status)}
                    </div>

                </div>
            `;
        });


        if(matches.length > 50){

            html += `
                <div class="info">
                    Showing first 50 of
                    ${matches.length} fixtures.
                </div>
            `;
        }


        result.innerHTML = html;


    }catch(error){

        result.innerHTML = `
            <div class="error">

                ❌ API ERROR

                <br><br>

                ${escapeHTML(error.message)}

            </div>
        `;
    }
}


/* =====================================================
   SECURITY — DISPLAY TEXT SAFELY
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
