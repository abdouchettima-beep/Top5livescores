<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 5 Leagues - Live Scores</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    background: linear-gradient(90deg, #12a879, #1595ff);
    padding: 14px 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 20;
}

.ad {
    margin: 15px auto;
    width: 90%;
    max-width: 500px;
    height: 80px;
    background: #202020;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
}

.key-status {
    width: 95%;
    max-width: 700px;
    margin: 10px auto;
    padding: 14px;
    text-align: center;
    background: #151515;
    border-radius: 12px;
    color: #aaa;
}

.leagues {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px;
    scrollbar-width: none;
}

.leagues::-webkit-scrollbar {
    display: none;
}

.league-btn {
    flex: 0 0 auto;
    border: none;
    border-radius: 25px;
    padding: 12px 16px;
    background: #292929;
    color: white;
    font-weight: bold;
    font-size: 14px;
}

.league-btn.active {
    background: #168ff5;
}

.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    flex-wrap: wrap;
}

.tab {
    border: none;
    border-radius: 25px;
    padding: 12px 18px;
    background: #292929;
    color: white;
    font-weight: bold;
    font-size: 14px;
}

.tab.active {
    background: #168ff5;
}

.refresh {
    display: block;
    margin: 5px auto 15px;
    border: none;
    border-radius: 25px;
    padding: 12px 22px;
    background: #333;
    color: white;
    font-weight: bold;
}

.date-bar {
    width: 95%;
    max-width: 900px;
    margin: 10px auto;
    background: #151515;
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    display: flex;
    gap: 8px;
}

.date-btn {
    flex: 0 0 auto;
    border: none;
    background: #292929;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
}

.date-btn.active {
    background: #168ff5;
}

.section-title {
    text-align: center;
    font-size: 20px;
    margin: 18px 0 10px;
}

.loading {
    text-align: center;
    padding: 30px;
    font-size: 18px;
    color: #bbb;
}

.error {
    width: 95%;
    max-width: 700px;
    margin: 15px auto;
    padding: 16px;
    background: #481919;
    border: 1px solid #a33;
    border-radius: 10px;
    color: #ffaaaa;
    white-space: pre-wrap;
}

.match {
    width: 95%;
    max-width: 900px;
    margin: 8px auto;
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px;
    border-left: 3px solid #168ff5;
}

.competition {
    color: #168ff5;
    font-weight: bold;
    font-size: 14px;
}

.country {
    color: #aaa;
    margin-top: 4px;
}

.match-time {
    text-align: center;
    color: #ffd43b;
    font-weight: bold;
    margin: 8px 0;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 70px 1fr;
    align-items: center;
    gap: 5px;
}

.team {
    font-size: 17px;
    font-weight: bold;
}

.home {
    text-align: right;
}

.away {
    text-align: left;
}

.score {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    vertical-align: middle;
    margin: 0 5px;
}

.status {
    text-align: center;
    margin-top: 8px;
    color: #00e676;
}

.live {
    color: #ff4040;
}

.venue {
    text-align: center;
    margin-top: 7px;
    color: #888;
    font-size: 12px;
}

.no-matches {
    text-align: center;
    color: #aaa;
    padding: 40px 15px;
}

.footer {
    text-align: center;
    color: #555;
    padding: 25px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
    ⚽ Top 5 Leagues - Live Scores
</div>

<div class="ad">
    AdMob Banner
</div>

<div id="keyStatus" class="key-status">
    Checking API key...
</div>

<div class="leagues">
    <button class="league-btn active" data-league="all">🌐 All</button>
    <button class="league-btn" data-league="39">🏴 Premier League</button>
    <button class="league-btn" data-league="140">🇪🇸 La Liga</button>
    <button class="league-btn" data-league="135">🇮🇹 Serie A</button>
    <button class="league-btn" data-league="78">🇩🇪 Bundesliga</button>
    <button class="league-btn" data-league="61">🇫🇷 Ligue 1</button>
    <button class="league-btn" data-league="2">🏆 Champions League</button>
</div>

<div class="tabs">
    <button class="tab active" data-tab="live">🔴 Live</button>
    <button class="tab" data-tab="upcoming">📅 Upcoming</button>
    <button class="tab" data-tab="finished">✅ Finished</button>
</div>

<button class="refresh" onclick="refreshData()">🔄 Refresh</button>

<div id="dateBar" class="date-bar" style="display:none;"></div>

<div id="content">
    <div class="loading">⏳ Loading matches...</div>
</div>

<div class="footer">
    LiveScore Football<br>
    Powered by API-Football
</div>

<script>

/* =========================================================
   API KEY
   ========================================================= */

const API_KEY = "PASTE_YOUR_API_KEY_HERE";


/* =========================================================
   LEAGUES
   ========================================================= */

const LEAGUES = {
    "39": {
        name: "Premier League",
        country: "England"
    },

    "140": {
        name: "La Liga",
        country: "Spain"
    },

    "135": {
        name: "Serie A",
        country: "Italy"
    },

    "78": {
        name: "Bundesliga",
        country: "Germany"
    },

    "61": {
        name: "Ligue 1",
        country: "France"
    },

    "2": {
        name: "Champions League",
        country: "Europe"
    }
};


/* =========================================================
   APP STATE
   ========================================================= */

let selectedLeague = "all";
let selectedTab = "live";
let selectedDate = todayString();

let allFixtures = [];
let liveFixtures = [];

const CACHE_TIME = 30 * 60 * 1000;


/* =========================================================
   DATE FUNCTIONS
   ========================================================= */

function todayString() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function addDays(dateString, days) {

    const date = new Date(dateString + "T12:00:00");

    date.setDate(date.getDate() + days);

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatDate(dateString) {

    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString("en-GB", {
        weekday: "short",
        day: "numeric",
        month: "short"
    });
}


/* =========================================================
   API REQUEST
   ========================================================= */

async function apiRequest(url) {

    const response = await fetch(url, {
        method: "GET",
        headers: {
            "x-apisports-key": API_KEY,
            "Accept": "application/json"
        }
    });

    const data = await response.json();

    if (!response.ok || data.errors && Object.keys(data.errors).length) {

        throw new Error(
            JSON.stringify(data.errors || data, null, 2)
        );
    }

    return data;
}


/* =========================================================
   CACHE
   ========================================================= */

function getCache(key) {

    try {

        const saved = localStorage.getItem(key);

        if (!saved) return null;

        const parsed = JSON.parse(saved);

        if (Date.now() - parsed.time > CACHE_TIME) {

            localStorage.removeItem(key);

            return null;
        }

        return parsed.data;

    } catch {

        return null;
    }
}


function setCache(key, data) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify({
                time: Date.now(),
                data: data
            })
        );

    } catch {}
}


/* =========================================================
   LOAD SEASON FIXTURES
   ========================================================= */

async function loadLeagueFixtures(leagueId) {

    const season = new Date().getFullYear();

    const cacheKey = `fixtures_${leagueId}_${season}`;

    const cached = getCache(cacheKey);

    if (cached) {

        return cached;
    }


    const url =
        `https://v3.football.api-sports.io/fixtures` +
        `?league=${leagueId}` +
        `&season=${season}`;


    const data = await apiRequest(url);

    const fixtures = data.response || [];

    setCache(cacheKey, fixtures);

    return fixtures;
}


/* =========================================================
   LOAD ALL LEAGUES
   ========================================================= */

async function loadAllFixtures() {

    document.getElementById("content").innerHTML =
        `<div class="loading">⏳ Loading league fixtures...</div>`;

    allFixtures = [];


    for (const leagueId of Object.keys(LEAGUES)) {

        try {

            const fixtures =
                await loadLeagueFixtures(leagueId);

            allFixtures =
                allFixtures.concat(fixtures);

        } catch (error) {

            console.log(
                "Could not load league:",
                leagueId,
                error
            );
        }
    }


    allFixtures.sort(function(a, b) {

        return new Date(a.fixture.date) -
               new Date(b.fixture.date);

    });


    showCurrentTab();
}


/* =========================================================
   LIVE MATCHES
   ========================================================= */

async function loadLive() {

    document.getElementById("content").innerHTML =
        `<div class="loading">🔴 Checking live matches...</div>`;


    try {

        const data = await apiRequest(
            "https://v3.football.api-sports.io/fixtures?live=all"
        );

        liveFixtures = data.response || [];

        showLive();

    } catch (error) {

        showError(error.message);
    }
}


/* =========================================================
   FILTER LEAGUE
   ========================================================= */

function filterLeague(fixtures) {

    if (selectedLeague === "all") {

        return fixtures;
    }

    return fixtures.filter(function(match) {

        return String(match.league.id) ===
               String(selectedLeague);

    });
}


/* =========================================================
   UPCOMING
   ========================================================= */

function showUpcoming() {

    const filtered = filterLeague(allFixtures);

    const matches = filtered.filter(function(match) {

        const date = match.fixture.date.substring(0, 10);

        return date === selectedDate &&
               !isFinished(match) &&
               !isLive(match);

    });

    renderMatches(
        matches,
        `📅 Upcoming Matches — ${formatDate(selectedDate)}`
    );
}


/* =========================================================
   FINISHED
   ========================================================= */

function showFinished() {

    const filtered = filterLeague(allFixtures);

    const matches = filtered.filter(function(match) {

        const date = match.fixture.date.substring(0, 10);

        return date === selectedDate &&
               isFinished(match);

    });

    renderMatches(
        matches,
        `✅ Finished Matches — ${formatDate(selectedDate)}`
    );
}


/* =========================================================
   LIVE DISPLAY
   ========================================================= */

function showLive() {

    const filtered = filterLeague(liveFixtures);

    renderMatches(
        filtered,
        "🔴 Live Matches"
    );
}


/* =========================================================
   STATUS CHECKS
   ========================================================= */

function isLive(match) {

    const status =
        match.fixture.status.short;

    return [
        "1H",
        "HT",
        "2H",
        "ET",
        "BT",
        "P"
    ].includes(status);
}


function isFinished(match) {

    const status =
        match.fixture.status.short;

    return [
        "FT",
        "AET",
        "PEN"
    ].includes(status);
}


/* =========================================================
   MATCH RENDERING
   ========================================================= */

function renderMatches(matches, title) {

    const content =
        document.getElementById("content");


    if (!matches.length) {

        content.innerHTML = `
            <div class="section-title">${title}</div>

            <div class="no-matches">
                No matches available for this selection.
            </div>
        `;

        return;
    }


    let html =
        `<div class="section-title">${title}</div>`;


    matches.forEach(function(match) {

        html += createMatchHTML(match);

    });


    content.innerHTML = html;
}


/* =========================================================
   MATCH CARD
   ========================================================= */

function createMatchHTML(match) {

    const league =
        match.league?.name || "Football";

    const country =
        match.league?.country || "";

    const home =
        match.teams?.home?.name || "Home";

    const away =
        match.teams?.away?.name || "Away";

    const homeLogo =
        match.teams?.home?.logo || "";

    const awayLogo =
        match.teams?.away?.logo || "";


    const status =
        match.fixture?.status?.short || "NS";


    const elapsed =
        match.fixture?.status?.elapsed;


    const homeScore =
        match.goals?.home;

    const awayScore =
        match.goals?.away;


    const matchDate =
        new Date(match.fixture.date);


    const time =
        matchDate.toLocaleTimeString(
            "en-NG",
            {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true,
                timeZone: "Africa/Lagos"
            }
        );


    let statusText = status;

    if (isLive(match) && elapsed) {

        statusText =
            `${status} ${elapsed}'`;

    }


    let score = "-";

    if (
        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined
    ) {

        score =
            `${homeScore} - ${awayScore}`;
    }


    let liveClass =
        isLive(match) ? "live" : "";


    return `
        <div class="match">

            <div class="competition">
                🏆 ${league}
            </div>

            <div class="country">
                ${country}
            </div>

            <div class="match-time">
                ⏰ ${time}
            </div>

            <div class="teams">

                <div class="team home">
                    ${home}
                    ${
                        homeLogo
                        ? `<img class="logo"
                           src="${homeLogo}"
                           onerror="this.style.display='none'">`
                        : ""
                    }
                </div>

                <div class="score">
                    ${score}
                </div>

                <div class="team away">
                    ${
                        awayLogo
                        ? `<img class="logo"
                           src="${awayLogo}"
                           onerror="this.style.display='none'">`
                        : ""
                    }
                    ${away}
                </div>

            </div>

            <div class="status ${liveClass}">
                ${isLive(match) ? "🔴 " : ""}
                Status: ${statusText}
            </div>

            ${
                match.fixture?.venue?.name
                ? `
                <div class="venue">
                    🏟️ ${match.fixture.venue.name}
                </div>
                `
                : ""
            }

        </div>
    `;
}


/* =========================================================
   DATE BAR
   ========================================================= */

function buildDateBar() {

    const bar =
        document.getElementById("dateBar");


    if (selectedTab === "live") {

        bar.style.display = "none";

        return;
    }


    bar.style.display = "flex";

    let html = "";


    for (let i = 0; i < 7; i++) {

        const date =
            addDays(todayString(), i);


        let label;

        if (i === 0) {

            label = "Today";

        } else if (i === 1) {

            label = "Tomorrow";

        } else {

            label = formatDate(date);
        }


        html += `
            <button
                class="date-btn ${date === selectedDate ? "active" : ""}"
                onclick="selectDate('${date}')">
                ${label}
            </button>
        `;
    }


    bar.innerHTML = html;
}


function selectDate(date) {

    selectedDate = date;

    buildDateBar();

    showCurrentTab();
}


/* =========================================================
   CURRENT TAB
   ========================================================= */

function showCurrentTab() {

    buildDateBar();


    if (selectedTab === "live") {

        loadLive();

    } else if (selectedTab === "upcoming") {

        showUpcoming();

    } else {

        showFinished();
    }
}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message) {

    document.getElementById("content").innerHTML = `
        <div class="error">
            ❌ API Error

            ${message}
        </div>
    `;
}


/* =========================================================
   REFRESH
   ========================================================= */

async function refreshData() {

    localStorage.clear();

    allFixtures = [];
    liveFixtures = [];

    await loadAllFixtures();
}


/* =========================================================
   LEAGUE BUTTONS
   ========================================================= */

document.querySelectorAll(".league-btn")
.forEach(function(button) {

    button.addEventListener("click", function() {

        document
            .querySelectorAll(".league-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        selectedLeague =
            button.dataset.league;

        showCurrentTab();
    });

});


/* =========================================================
   TAB BUTTONS
   ========================================================= */

document.querySelectorAll(".tab")
.forEach(function(button) {

    button.addEventListener("click", async function() {

        document
            .querySelectorAll(".tab")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        selectedTab =
            button.dataset.tab;

        buildDateBar();


        if (selectedTab === "live") {

            await loadLive();

        } else {

            if (!allFixtures.length) {

                await loadAllFixtures();

            } else {

                showCurrentTab();
            }
        }

    });

});


/* =========================================================
   API KEY STATUS
   ========================================================= */

function checkKey() {

    const status =
        document.getElementById("keyStatus");


    if (
        !API_KEY ||
        API_KEY === "PASTE_YOUR_API_KEY_HERE"
    ) {

        status.innerHTML =
            "⚠️ API key has not been added.";

    } else {

        status.innerHTML =
            "✅ API Key Loaded";
    }
}


/* =========================================================
   START APP
   ========================================================= */

checkKey();

buildDateBar();

loadAllFixtures();

</script>

</body>
</html>
