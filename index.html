<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top 5 Leagues - Live Scores</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080808;
  color: #fff;
  text-align: center;
  min-height: 100vh;
}

header {
  background: linear-gradient(90deg,#1ea36b,#1e90ff);
  padding: 17px 10px;
  font-size: 1.4rem;
  font-weight: bold;
}

.ad-container {
  width: 92%;
  max-width: 480px;
  height: 60px;
  margin: 12px auto;
  background: #222;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 13px;
}

#leagueNav {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 10px;
  background: #111;
}

#leagueNav button {
  flex: 0 0 auto;
  padding: 10px 14px;
  border: none;
  border-radius: 20px;
  background: #333;
  color: white;
  font-weight: bold;
  white-space: nowrap;
}

#leagueNav button.active {
  background: #1ea36b;
}

#toggleButtons {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px 10px 10px;
}

#toggleButtons button,
#refreshButton {
  border: none;
  border-radius: 20px;
  padding: 10px 17px;
  background: #333;
  color: white;
  font-weight: bold;
}

#toggleButtons button.active {
  background: #1e90ff;
}

#refreshButton {
  margin: 5px 0 12px;
  background: #444;
}

.section-title {
  font-size: 1.15rem;
  font-weight: bold;
  margin: 12px 0;
}

.match {
  background: #181818;
  border-radius: 12px;
  margin: 12px auto;
  padding: 15px;
  width: 92%;
  max-width: 480px;
  box-shadow: 0 4px 12px rgba(0,0,0,.45);
}

.league-name {
  color: #888;
  font-size: 12px;
  margin-bottom: 8px;
}

.round {
  color: #777;
  font-size: 12px;
  margin-bottom: 8px;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.team {
  width: 38%;
  font-size: 14px;
  font-weight: bold;
}

.team-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  display: block;
  margin: 0 auto 7px;
}

.score-area {
  width: 24%;
}

.score {
  font-size: 21px;
  font-weight: bold;
  color: #1ea36b;
}

.status {
  display: inline-block;
  margin-top: 7px;
  padding: 4px 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: bold;
}

.live {
  background: #dc2626;
}

.halftime {
  background: #f59e0b;
  color: #000;
}

.finished {
  background: #555;
}

.upcoming {
  background: #1e90ff;
}

.postponed {
  background: #9333ea;
}

.live-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: red;
  border-radius: 50%;
  margin-right: 4px;
  animation: pulse 1.3s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: .25; }
}

.match-time {
  margin-top: 10px;
  color: #aaa;
  font-size: 13px;
}

.loading {
  padding: 25px;
  color: #aaa;
}

.no-matches {
  padding: 30px;
  color: #888;
}

.error {
  width: 92%;
  max-width: 480px;
  margin: 15px auto;
  padding: 15px;
  background: rgba(255,70,70,.12);
  border: 1px solid #a33;
  border-radius: 10px;
  color: #ff7777;
  font-size: 14px;
}

footer {
  color: #666;
  font-size: 11px;
  padding: 25px;
}
</style>
</head>

<body>

<header>
⚽ Top 5 Leagues - Live Scores
</header>

<div class="ad-container">
AdMob Banner
</div>

<nav id="leagueNav">

<button class="active" onclick="loadLeague(39,this)">
🏴 Premier League
</button>

<button onclick="loadLeague(140,this)">
🇪🇸 La Liga
</button>

<button onclick="loadLeague(135,this)">
🇮🇹 Serie A
</button>

<button onclick="loadLeague(78,this)">
🇩🇪 Bundesliga
</button>

<button onclick="loadLeague(61,this)">
🇫🇷 Ligue 1
</button>

<button onclick="loadLeague(2,this)">
🏆 Champions League
</button>

</nav>

<div id="toggleButtons">

<button class="active" onclick="showMatches('live')">
🔴 Live Matches
</button>

<button onclick="showMatches('upcoming')">
📅 Upcoming Matches
</button>

</div>

<button id="refreshButton" onclick="refreshCurrentView()">
🔄 Refresh
</button>

<div id="liveMatches">

<div class="section-title">
🔴 Live Matches
</div>

</div>

<div id="upcomingMatches" style="display:none">

<div class="section-title">
📅 Upcoming Matches
</div>

</div>

<footer>
LiveScore Football
</footer>

<script>

/* =====================================================
   API CONFIGURATION
===================================================== */

/*
   PASTE YOUR NEW API KEY BETWEEN THE QUOTES.

   Example:

   const apiKey = "5fcbf614d2e2a8737aaf0dc8758f7717";

   DO NOT SEND YOUR KEY TO ANYONE.
*/

const apiKey = "PASTE_YOUR_NEW_API_KEY_HERE";

const baseURL =
"https://v3.football.api-sports.io";

/*
   TEMPORARY CORS PROXY

   This is being used only so we can test
   the GitHub Pages version from your phone.

   We will remove this later and secure
   the API key properly.
*/

const corsProxy =
"https://corsproxy.io/?";

let currentLeagueId = 39;

let currentView = "live";

/*
   2026 = 2026/27 season.
*/

const season = 2026;


/* =====================================================
   LEAGUE NAMES
===================================================== */

const leagueNames = {

  39: "Premier League",

  140: "La Liga",

  135: "Serie A",

  78: "Bundesliga",

  61: "Ligue 1",

  2: "Champions League"

};


/* =====================================================
   API REQUEST
===================================================== */

async function fetchAPI(url) {

  try {

    console.log("Requesting:", url);

    const proxyURL =
      corsProxy +
      encodeURIComponent(url);

    const response = await fetch(
      proxyURL,
      {
        method: "GET",

        headers: {

          "x-apisports-key": apiKey,

          "Accept": "application/json"

        }
      }
    );

    const data =
      await response.json();

    console.log(
      "API response:",
      data
    );

    if (!response.ok) {

      return {

        errors: {

          http:
          "HTTP " +
          response.status

        }

      };

    }

    return data;

  }

  catch(error) {

    console.error(
      "Fetch error:",
      error
    );

    return {

      errors: {

        network:
        error.message

      }

    };

  }

}


/* =====================================================
   API KEY CHECK
===================================================== */

function validKey() {

  return (

    apiKey &&

    apiKey !==
    "5fcbf614d2e2a8737aaf0dc8758f7717"

  );

}


/* =====================================================
   LOAD LEAGUE
===================================================== */

async function loadLeague(
  leagueId,
  button
) {

  currentLeagueId =
    leagueId;

  document
    .querySelectorAll(
      "#leagueNav button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });

  if (button) {

    button.classList.add(
      "active"
    );

  }

  if (!validKey()) {

    showKeyError();

    return;

  }

  if (currentView === "live") {

    await loadLiveMatches();

  }

  else {

    await loadUpcomingMatches();

  }

}


/* =====================================================
   LIVE MATCHES
===================================================== */

async function loadLiveMatches() {

  const container =
    document.getElementById(
      "liveMatches"
    );

  container.innerHTML = `

    <div class="section-title">
      🔴 Live Matches
    </div>

    <div class="loading">
      Loading live matches...
    </div>

  `;

  const url =
    `${baseURL}/fixtures` +
    `?live=all` +
    `&league=${currentLeagueId}`;

  const data =
    await fetchAPI(url);

  container.innerHTML = `

    <div class="section-title">
      🔴 Live Matches
    </div>

  `;

  if (
    data.errors &&
    Object.keys(data.errors).length
  ) {

    showAPIError(
      container,
      data.errors
    );

    return;

  }

  const matches =
    data.response || [];

  if (!matches.length) {

    container.innerHTML += `

      <div class="no-matches">

        No live matches right now.

      </div>

    `;

    return;

  }

  matches.forEach(match => {

    container.innerHTML +=
      createMatch(
        match,
        true
      );

  });

}


/* =====================================================
   UPCOMING MATCHES
===================================================== */

async function loadUpcomingMatches() {

  const container =
    document.getElementById(
      "upcomingMatches"
    );

  container.innerHTML = `

    <div class="section-title">
      📅 Upcoming Matches
    </div>

    <div class="loading">
      Loading upcoming matches...
    </div>

  `;

  const today =
    new Date();

  const from =
    formatDate(today);

  const end =
    new Date();

  end.setDate(
    end.getDate() + 14
  );

  const to =
    formatDate(end);

  const url =
    `${baseURL}/fixtures` +
    `?league=${currentLeagueId}` +
    `&season=${season}` +
    `&from=${from}` +
    `&to=${to}`;

  const data =
    await fetchAPI(url);

  container.innerHTML = `

    <div class="section-title">
      📅 Upcoming Matches
    </div>

  `;

  if (
    data.errors &&
    Object.keys(data.errors).length
  ) {

    showAPIError(
      container,
      data.errors
    );

    return;

  }

  let matches =
    data.response || [];

  matches =
    matches.filter(match => {

      const status =
        match.fixture.status.short;

      return (
        status === "NS" ||
        status === "TBD"
      );

    });

  matches.sort((a,b) => {

    return new Date(
      a.fixture.date
    ) -
    new Date(
      b.fixture.date
    );

  });

  matches =
    matches.slice(0,20);

  if (!matches.length) {

    container.innerHTML += `

      <div class="no-matches">

        No upcoming matches found.

      </div>

    `;

    return;

  }

  matches.forEach(match => {

    container.innerHTML +=
      createMatch(
        match,
        false
      );

  });

}


/* =====================================================
   MATCH CARD
===================================================== */

function createMatch(
  match,
  isLive
) {

  const home =
    match.teams.home;

  const away =
    match.teams.away;

  const homeScore =
    match.goals.home ??
    "-";

  const awayScore =
    match.goals.away ??
    "-";

  const status =
    match.fixture.status.short;

  const elapsed =
    match.fixture.status.elapsed;

  let statusText =
    match.fixture.status.long;

  let statusClass =
    "upcoming";

  if (
    status === "1H" ||
    status === "2H" ||
    status === "ET" ||
    status === "P"
  ) {

    statusClass =
      "live";

    statusText =
      elapsed
      ? `LIVE - ${elapsed}'`
      : "LIVE";

  }

  else if (
    status === "HT"
  ) {

    statusClass =
      "halftime";

    statusText =
      "Half Time";

  }

  else if (
    status === "FT" ||
    status === "AET" ||
    status === "PEN"
  ) {

    statusClass =
      "finished";

    statusText =
      "Finished";

  }

  else if (
    status === "PST" ||
    status === "CANC"
  ) {

    statusClass =
      "postponed";

    statusText =
      status === "PST"
      ? "Postponed"
      : "Cancelled";

  }

  const date =
    new Date(
      match.fixture.date
    );

  const nigeriaTime =
    date.toLocaleString(
      "en-NG",
      {

        timeZone:
        "Africa/Lagos",

        weekday:
        "short",

        day:
        "2-digit",

        month:
        "short",

        hour:
        "2-digit",

        minute:
        "2-digit",

        hour12:
        true

      }
    );

  const round =
    match.league.round ||
    "";

  const score =
    isLive
    ? `${homeScore} - ${awayScore}`
    : "vs";

  return `

    <div class="match">

      <div class="league-name">

        ${match.league.name}

      </div>

      ${
        round
        ?
        `<div class="round">
          ${round}
        </div>`
        :
        ""
      }

      <div class="teams">

        <div class="team">

          <img
            class="team-logo"
            src="${home.logo}"
            alt="${home.name}"
          >

          ${home.name}

        </div>

        <div class="score-area">

          <div class="score">

            ${score}

          </div>

          <div class="status ${statusClass}">

            ${
              isLive
              ?
              `<span class="live-dot"></span>`
              :
              ""
            }

            ${statusText}

          </div>

        </div>

        <div class="team">

          <img
            class="team-logo"
            src="${away.logo}"
            alt="${away.name}"
          >

          ${away.name}

        </div>

      </div>

      <div class="match-time">

        🕒 ${nigeriaTime}

      </div>

    </div>

  `;

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =====================================================
   LIVE / UPCOMING TOGGLE
===================================================== */

function showMatches(type) {

  currentView =
    type;

  const buttons =
    document.querySelectorAll(
      "#toggleButtons button"
    );

  buttons.forEach(btn => {

    btn.classList.remove(
      "active"
    );

  });

  if (type === "live") {

    buttons[0]
      .classList.add(
        "active"
      );

    document.getElementById(
      "liveMatches"
    ).style.display =
      "block";

    document.getElementById(
      "upcomingMatches"
    ).style.display =
      "none";

    if (validKey()) {

      loadLiveMatches();

    }

  }

  else {

    buttons[1]
      .classList.add(
        "active"
      );

    document.getElementById(
      "liveMatches"
    ).style.display =
      "none";

    document.getElementById(
      "upcomingMatches"
    ).style.display =
      "block";

    if (validKey()) {

      loadUpcomingMatches();

    }

  }

}


/* =====================================================
   REFRESH
===================================================== */

function refreshCurrentView() {

  if (!validKey()) {

    showKeyError();

    return;

  }

  if (currentView === "live") {

    loadLiveMatches();

  }

  else {

    loadUpcomingMatches();

  }

}


/* =====================================================
   KEY ERROR
===================================================== */

function showKeyError() {

  document.getElementById(
    "liveMatches"
  ).innerHTML = `

    <div class="section-title">
      🔴 Live Matches
    </div>

    <div class="error">

      ⚠️ API key not added.

      <br><br>

      Add your new API-Football
      key in the API configuration
      section.

    </div>

  `;

}


/* =====================================================
   API ERROR
===================================================== */

function showAPIError(
  container,
  errors
) {

  console.error(
    "API Error:",
    errors
  );

  container.innerHTML += `

    <div class="error">

      ❌ API request failed.

      <br><br>

      Open the browser console
      to see the technical error.

    </div>

  `;

}


/* =====================================================
   START APP
===================================================== */

loadLeague(
  currentLeagueId
);

</script>

</body>
</html>
