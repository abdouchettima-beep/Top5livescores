<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">
<title>Top 5 LiveScore</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#17202a;
    padding-bottom:70px
}
.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:58px;
    background:linear-gradient(100deg,#087f5b,#0878d1);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold
}
.header span{margin-left:7px}
.api-box{
    display:none;
    margin:12px;
    padding:15px;
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px #0001
}
.api-box.show{display:block}
.api-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin:8px 0
}
.api-box button,.refresh{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    background:#087f5b;
    color:white;
    font-weight:bold
}
.ad{
    height:60px;
    margin:10px auto;
    max-width:380px;
    background:#ddd;
    color:#999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px
}
.search{
    padding:8px 12px
}
.search input{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:22px;
    outline:none;
    background:white
}
.leagues{
    display:flex;
    overflow-x:auto;
    gap:7px;
    padding:4px 12px 10px;
    scrollbar-width:none
}
.leagues::-webkit-scrollbar{display:none}
.league{
    white-space:nowrap;
    border:0;
    border-radius:20px;
    padding:9px 13px;
    background:white;
    color:#444;
    font-size:11px;
    font-weight:bold
}
.league.active{background:#087f5b;color:white}
.tabs{
    display:flex;
    justify-content:center;
    gap:7px;
    padding:4px 10px 8px
}
.tab{
    border:0;
    border-radius:20px;
    padding:9px 14px;
    background:white;
    font-weight:bold;
    color:#555
}
.tab.active{background:#0878d1;color:white}
.tab.live.active{background:#df3044}
.refresh-area{text-align:center;padding:3px 0 10px}
.refresh{background:#17202a;padding:8px 17px}
.title{
    display:flex;
    justify-content:space-between;
    padding:8px 13px;
    font-size:16px;
    font-weight:bold
}
.count{font-size:11px;color:#888;font-weight:normal}
.loading{text-align:center;padding:45px;color:#888}
.spinner{
    width:35px;
    height:35px;
    margin:auto auto 14px;
    border:4px solid #ddd;
    border-top-color:#087f5b;
    border-radius:50%;
    animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.error,.empty{
    margin:14px;
    padding:25px;
    text-align:center;
    border-radius:12px;
    background:white
}
.error{color:#c62828}
.empty{color:#777}
.date-title{
    padding:9px 13px 4px;
    font-size:12px;
    color:#777;
    font-weight:bold
}
.card{
    background:white;
    margin:7px 10px;
    border-radius:12px;
    padding:11px;
    box-shadow:0 1px 5px #00000012;
    border-left:4px solid #0878d1
}
.card.live{border-left-color:#df3044}
.card-top{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:#0878d1;
    font-weight:bold;
    margin-bottom:8px
}
.status.live{color:#df3044}
.team{
    display:flex;
    align-items:center;
    min-height:38px
}
.team-name{
    flex:1;
    font-size:13px;
    font-weight:bold
}
.logo{
    width:30px;
    height:30px;
    object-fit:contain;
    margin-right:9px
}
.score{
    width:35px;
    text-align:right;
    font-size:18px;
    font-weight:bold
}
.match-time{
    text-align:center;
    color:#d28a00;
    font-size:11px;
    font-weight:bold;
    padding:3px
}
.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
    color:#999;
    font-size:9px
}
.star{
    border:0;
    background:none;
    font-size:19px;
    color:#bbb
}
.star.on{color:#f5b400}
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    z-index:1000
}
.nav{
    flex:1;
    border:0;
    background:none;
    color:#777;
    font-size:10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px
}
.nav b{font-size:20px}
.nav.active{color:#087f5b}
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:#0008;
    overflow:auto
}
.modal.show{display:block}
.modal-content{
    background:#f1f3f5;
    min-height:100%;
    max-width:700px;
    margin:auto
}
.modal-head{
    background:linear-gradient(100deg,#087f5b,#0878d1);
    color:white;
    padding:14px;
    display:flex;
    align-items:center
}
.close{
    border:0;
    background:none;
    color:white;
    font-size:27px;
    margin-right:12px
}
.detail-header{
    background:white;
    padding:20px 12px;
    text-align:center
}
.detail-league{
    color:#0878d1;
    font-size:12px;
    font-weight:bold
}
.detail-teams{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin:15px 0
}
.detail-team{
    width:40%;
    font-weight:bold;
    font-size:13px
}
.detail-logo{
    width:55px;
    height:55px;
    object-fit:contain;
    display:block;
    margin:auto
}
.detail-score{
    font-size:27px;
    font-weight:bold
}
.detail-status{font-size:12px;color:#df3044;font-weight:bold}
.detail-tabs{
    display:flex;
    overflow-x:auto;
    background:white;
    border-bottom:1px solid #ddd
}
.detail-tab{
    flex:1;
    min-width:100px;
    border:0;
    background:white;
    padding:12px 8px;
    font-weight:bold;
    color:#777
}
.detail-tab.active{color:#087f5b;border-bottom:3px solid #087f5b}
.detail-body{padding:10px}
.detail-section{
    background:white;
    margin-bottom:10px;
    padding:14px;
    border-radius:10px
}
.event{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:8px 0;
    font-size:12px
}
.event.home{justify-content:flex-start}
.event.away{justify-content:flex-end}
.event-icon{font-size:17px}
.stat{
    margin:10px 0
}
.stat-head{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:bold
}
.bar{
    height:7px;
    background:#ddd;
    border-radius:5px;
    overflow:hidden;
    margin-top:5px
}
.bar-inner{
    height:100%;
    background:#0878d1
}
.lineup{
    padding:7px 0;
    border-bottom:1px solid #eee;
    font-size:12px
}
.standings{
    width:100%;
    border-collapse:collapse;
    background:white;
    font-size:10px
}
.standings th,.standings td{
    padding:8px 4px;
    border-bottom:1px solid #eee;
    text-align:center
}
.standings th:first-child,
.standings td:first-child{text-align:left}
</style>
</head>

<body>

<header class="header">
    ⚽ <span>Top 5 LiveScore</span>
</header>

<div id="apiBox" class="api-box">
    <b>⚙️ API-Football Setup</b>
    <p style="font-size:12px;color:#777">
        Enter your API-Football key to load matches.
    </p>
    <input id="apiKey" type="password" placeholder="Enter API key">
    <button onclick="saveKey()">Save & Load</button>
</div>

<div class="ad">ADVERTISEMENT</div>

<div class="search">
    <input id="search" placeholder="🔎 Search team or league..." oninput="render()">
</div>

<div class="leagues">
    <button class="league active" onclick="leagueFilter('all',this)">🌍 All</button>
    <button class="league" onclick="leagueFilter('39',this)">🏴 Premier League</button>
    <button class="league" onclick="leagueFilter('140',this)">🇪🇸 La Liga</button>
    <button class="league" onclick="leagueFilter('135',this)">🇮🇹 Serie A</button>
    <button class="league" onclick="leagueFilter('78',this)">🇩🇪 Bundesliga</button>
    <button class="league" onclick="leagueFilter('61',this)">🇫🇷 Ligue 1</button>
    <button class="league" onclick="leagueFilter('2',this)">🏆 Champions League</button>
</div>

<div class="tabs">
    <button class="tab live active" onclick="setTab('live',this)">🔴 Live</button>
    <button class="tab" onclick="setTab('upcoming',this)">📅 Upcoming</button>
    <button class="tab" onclick="setTab('finished',this)">✅ Results</button>
</div>

<div class="refresh-area">
    <button class="refresh" onclick="loadToday()">🔄 Refresh</button>
</div>

<div class="title">
    <span id="title">🔴 Live Matches</span>
    <span id="count" class="count"></span>
</div>

<div id="matches">
    <div class="loading">
        <div class="spinner"></div>
        Loading matches...
    </div>
</div>

<div class="ad">ADVERTISEMENT</div>

<div class="bottom">
    <button class="nav active" onclick="homeNav(this)">
        <b>🏠</b>Home
    </button>
    <button class="nav" onclick="setTab('live',document.querySelector('.tab.live'));navActive(this)">
        <b>🔴</b>Live
    </button>
    <button class="nav" onclick="setTab('upcoming',document.querySelectorAll('.tab')[1]);navActive(this)">
        <b>📅</b>Upcoming
    </button>
    <button class="nav" onclick="setTab('finished',document.querySelectorAll('.tab')[2]);navActive(this)">
        <b>🏆</b>Results
    </button>
    <button class="nav" onclick="favoritesPage(this)">
        <b>⭐</b>Favorites
    </button>
</div>

<!-- MATCH DETAILS MODAL -->

<div id="modal" class="modal">

<div class="modal-content">

    <div class="modal-head">
        <button class="close" onclick="closeModal()">×</button>
        <b>Match Details</b>
    </div>

    <div id="detailHeader"></div>

    <div class="detail-tabs">
        <button class="detail-tab active" onclick="detailTab('events',this)">⚽ Events</button>
        <button class="detail-tab" onclick="detailTab('stats',this)">📊 Statistics</button>
        <button class="detail-tab" onclick="detailTab('lineups',this)">👥 Lineups</button>
    </div>

    <div id="detailBody" class="detail-body"></div>

</div>
</div>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL = "https://v3.football.api-sports.io";

const LEAGUES = {
    "39":"Premier League",
    "140":"La Liga",
    "135":"Serie A",
    "78":"Bundesliga",
    "61":"Ligue 1",
    "2":"Champions League"
};

let API_KEY = localStorage.getItem("footballApiKey") || "";

let allMatches = [];

let selectedLeague = "all";

let selectedTab = "live";

let favoriteTeams =
    JSON.parse(localStorage.getItem("favoriteTeams") || "[]");

let currentFixture = null;


/* =====================================================
   API KEY
===================================================== */

function checkKey(){

    if(!API_KEY){

        document.getElementById("apiBox")
            .classList.add("show");

        return false;
    }

    return true;
}

function saveKey(){

    const key =
        document.getElementById("apiKey").value.trim();

    if(!key){
        alert("Please enter your API key.");
        return;
    }

    API_KEY = key;

    localStorage.setItem(
        "footballApiKey",
        API_KEY
    );

    document.getElementById("apiBox")
        .classList.remove("show");

    loadToday();
}


/* =====================================================
   DATE
===================================================== */

function today(){

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone:"Africa/Lagos",
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).formatToParts(new Date());

    const y =
        parts.find(x=>x.type==="year").value;

    const m =
        parts.find(x=>x.type==="month").value;

    const d =
        parts.find(x=>x.type==="day").value;

    return y+"-"+m+"-"+d;
}


/* =====================================================
   API REQUEST
===================================================== */

async function api(endpoint){

    const response =
        await fetch(
            API_URL + endpoint,
            {
                headers:{
                    "x-apisports-key":API_KEY
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok)
        throw new Error(
            "HTTP "+response.status
        );

    if(
        data.errors &&
        Object.keys(data.errors).length
    )
        throw new Error(
            JSON.stringify(data.errors)
        );

    return data.response || [];
}


/* =====================================================
   LOAD TODAY
===================================================== */

async function loadToday(){

    if(!checkKey()) return;

    const box =
        document.getElementById("matches");

    box.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading football matches...
        </div>
    `;

    try{

        allMatches =
            await api(
                "/fixtures?date="+
                today()+
                "&timezone=Africa/Lagos"
            );

        render();

    }catch(error){

        box.innerHTML = `
            <div class="error">
                ❌ Unable to load matches.
                <br><br>
                ${esc(error.message)}
                <br><br>
                Check your API key and press Refresh.
            </div>
        `;
    }
}


/* =====================================================
   FILTER
===================================================== */

function filtered(){

    let data = allMatches.filter(
        m => LEAGUES[String(m.league?.id)]
    );

    if(selectedLeague !== "all"){

        data =
            data.filter(
                m =>
                String(m.league.id) ===
                String(selectedLeague)
            );
    }

    const search =
        document.getElementById("search")
        .value.trim().toLowerCase();

    if(search){

        data =
            data.filter(m => {

                const h =
                    (m.teams?.home?.name || "")
                    .toLowerCase();

                const a =
                    (m.teams?.away?.name || "")
                    .toLowerCase();

                const l =
                    (m.league?.name || "")
                    .toLowerCase();

                return(
                    h.includes(search) ||
                    a.includes(search) ||
                    l.includes(search)
                );
            });
    }

    if(selectedTab === "live"){

        data =
            data.filter(m =>
                [
                    "1H","HT","2H",
                    "ET","BT","P","LIVE"
                ].includes(
                    m.fixture?.status?.short
                )
            );
    }

    else if(selectedTab === "upcoming"){

        data =
            data.filter(m =>
                [
                    "NS","TBD"
                ].includes(
                    m.fixture?.status?.short
                )
            );
    }

    else if(selectedTab === "finished"){

        data =
            data.filter(m =>
                [
                    "FT","AET","PEN"
                ].includes(
                    m.fixture?.status?.short
                )
            );
    }

    return data;
}


/* =====================================================
   RENDER
===================================================== */

function render(){

    if(selectedTab === "favorites"){
        renderFavorites();
        return;
    }

    const box =
        document.getElementById("matches");

    let data = filtered();

    data.sort(
        (a,b) =>
        new Date(a.fixture.date) -
        new Date(b.fixture.date)
    );

    document.getElementById("count")
        .textContent =
        data.length+" "+
        (data.length===1?"match":"matches");

    if(!data.length){

        let msg =
            selectedTab==="live"
            ? "🔴 No live matches right now."
            : selectedTab==="upcoming"
            ? "📅 No upcoming matches today."
            : "✅ No finished matches today.";

        box.innerHTML =
            `<div class="empty">
                ${msg}
                <br><br>
                Try another league or refresh.
             </div>`;

        return;
    }

    box.innerHTML =
        data.map(card).join("");
}


/* =====================================================
   MATCH CARD
===================================================== */

function card(m){

    const f = m.fixture;

    const home = m.teams.home;

    const away = m.teams.away;

    const status = f.status;

    const live =
        [
            "1H","HT","2H",
            "ET","BT","P","LIVE"
        ].includes(status.short);

    let statusText =
        status.short || "";

    if(status.short==="HT")
        statusText="HALF TIME";

    else if(live && status.elapsed)
        statusText=status.elapsed+"'";

    const homeScore =
        m.goals?.home ?? "-";

    const awayScore =
        m.goals?.away ?? "-";

    const favorite =
        favoriteTeams.includes(
            String(home.id)
        ) ||
        favoriteTeams.includes(
            String(away.id)
        );

    const time =
        status.short==="NS"
        ? formatTime(f.date)
        : "";

    return `
    <div class="card ${live?"live":""}"
         onclick="openMatch(${f.id})">

        <div class="card-top">

            <span>
                🏆 ${esc(m.league.name)}
            </span>

            <span class="${live?"status live":"status"}">
                ${live?"🔴 ":""}${esc(statusText)}
            </span>

        </div>

        ${
            time
            ? `<div class="match-time">
                   ⏰ ${time}
               </div>`
            : ""
        }

        <div class="team">

            ${
                home.logo
                ? `<img class="logo"
                        src="${home.logo}"
                        onerror="this.style.display='none'">`
                : ""
            }

            <span class="team-name">
                ${esc(home.name)}
            </span>

            <span class="score">
                ${homeScore}
            </span>

        </div>

        <div class="team">

            ${
                away.logo
                ? `<img class="logo"
                        src="${away.logo}"
                        onerror="this.style.display='none'">`
                : ""
            }

            <span class="team-name">
                ${esc(away.name)}
            </span>

            <span class="score">
                ${awayScore}
            </span>

        </div>

        <div class="card-footer">

            <span>
                ${
                    f.venue?.name
                    ? "🏟️ "+esc(f.venue.name)
                    : ""
                }
            </span>

            <button
                class="star ${favorite?"on":""}"
                onclick="event.stopPropagation();toggleFavorite(
                    '${home.id}',
                    '${away.id}'
                )">

                ${favorite?"★":"☆"}

            </button>

        </div>

    </div>
    `;
}


/* =====================================================
   LEAGUE
===================================================== */

function leagueFilter(id,btn){

    selectedLeague = id;

    document
        .querySelectorAll(".league")
        .forEach(
            x=>x.classList.remove("active")
        );

    btn.classList.add("active");

    selectedTab =
        selectedTab==="favorites"
        ? "live"
        : selectedTab;

    render();
}


/* =====================================================
   TABS
===================================================== */

function setTab(tab,btn){

    selectedTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(
            x=>x.classList.remove("active")
        );

    if(btn)
        btn.classList.add("active");

    if(tab==="live")
        document.getElementById("title")
        .textContent="🔴 Live Matches";

    else if(tab==="upcoming")
        document.getElementById("title")
        .textContent="📅 Upcoming Matches";

    else if(tab==="finished")
        document.getElementById("title")
        .textContent="✅ Results";

    render();
}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(home,away){

    [String(home),String(away)]
    .forEach(id=>{

        const index =
            favoriteTeams.indexOf(id);

        if(index>=0)
            favoriteTeams.splice(index,1);
        else
            favoriteTeams.push(id);

    });

    localStorage.setItem(
        "favoriteTeams",
        JSON.stringify(favoriteTeams)
    );

    render();
}

function favoritesPage(btn){

    selectedTab="favorites";

    document.getElementById("title")
        .textContent="⭐ Favorite Teams";

    document
        .querySelectorAll(".nav")
        .forEach(
            x=>x.classList.remove("active")
        );

    btn.classList.add("active");

    renderFavorites();
}

function renderFavorites(){

    const box =
        document.getElementById("matches");

    const data =
        allMatches.filter(m=>{

            const h =
                String(m.teams?.home?.id);

            const a =
                String(m.teams?.away?.id);

            return(
                favoriteTeams.includes(h) ||
                favoriteTeams.includes(a)
            );
        });

    if(!data.length){

        box.innerHTML =
            `<div class="empty">
                ⭐ No favorite teams yet.
                <br><br>
                Tap ☆ on a match to add its teams.
             </div>`;

        document.getElementById("count")
            .textContent="0 matches";

        return;
    }

    document.getElementById("count")
        .textContent=data.length+" matches";

    box.innerHTML =
        data.map(card).join("");
}


/* =====================================================
   HOME NAV
===================================================== */

function homeNav(btn){

    selectedTab="live";

    document
        .querySelectorAll(".nav")
        .forEach(
            x=>x.classList.remove("active")
        );

    btn.classList.add("active");

    const live =
        document.querySelector(".tab.live");

    setTab("live",live);
}

function navActive(btn){

    document
        .querySelectorAll(".nav")
        .forEach(
            x=>x.classList.remove("active")
        );

    btn.classList.add("active");
}


/* =====================================================
   MATCH DETAILS
===================================================== */

async function openMatch(id){

    currentFixture = id;

    document.getElementById("modal")
        .classList.add("show");

    const match =
        allMatches.find(
            m=>String(m.fixture.id)===String(id)
        );

    if(match)
        showDetailHeader(match);

    document.getElementById("detailBody")
        .innerHTML=`
        <div class="loading">
            <div class="spinner"></div>
            Loading match details...
        </div>`;

    try{

        await loadEvents();

    }catch(e){

        document.getElementById("detailBody")
            .innerHTML=
            `<div class="detail-section">
                Unable to load match details.
                <br><br>
                ${esc(e.message)}
             </div>`;
    }
}

function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");
}

function showDetailHeader(m){

/* =====================================================
   EVENTS
===================================================== */

async function loadEvents(){

    const events =
        await api(
            "/fixtures/events?fixture="+
            currentFixture
        );

    let html =
        `<div class="detail-section">
            <b>⚽ Match Events</b>`;

    if(!events.length){

        html +=
            `<p style="color:#888;font-size:12px">
                No events available.
             </p>`;

    }else{

        events.forEach(e=>{

            let icon="";

            if(e.type==="Goal")
                icon="⚽";

            else if(e.type==="Card")
                icon=e.detail?.includes("Red")
                    ?"🟥":"🟨";

            else if(e.type==="subst")
                icon="🔄";

            else
                icon="•";

            html += `
                <div class="event">

                    <span>
                        ${e.time?.elapsed || ""}'
                    </span>

                    <span class="event-icon">
                        ${icon}
                    </span>

                    <span>
                        ${esc(e.player?.name || "")}
                    </span>

                    ${
                        e.assist?.name
                        ? `<small>
                            (${esc(e.assist.name)})
                           </small>`
                        : ""
                    }

                </div>
            `;
        });
    }

    html += "</div>";

    document.getElementById("detailBody")
        .innerHTML=html;
}


/* =====================================================
   DETAIL TABS
===================================================== */

async function detailTab(type,btn){

    document
        .querySelectorAll(".detail-tab")
        .forEach(
            x=>x.classList.remove("active")
        );

    btn.classList.add("active");

    const body =
        document.getElementById("detailBody");

    body.innerHTML=`
        <div class="loading">
            <div class="spinner"></div>
            Loading...
        </div>`;

    try{

        if(type==="events")
            await loadEvents();

        if(type==="stats")
            await loadStats();

        if(type==="lineups")
            await loadLineups();

    }catch(e){

        body.innerHTML=
            `<div class="detail-section">
                ❌ ${esc(e.message)}
             </div>`;
    }
}


/* =====================================================
   STATISTICS
===================================================== */

async function loadStats(){

    const data =
        await api(
            "/fixtures/statistics?fixture="+
            currentFixture
        );

    const body =
        document.getElementById("detailBody");

    if(!data.length){

        body.innerHTML=
            `<div class="detail-section">
                📊 Statistics are not available
                for this match.
             </div>`;

        return;
    }

    const stats = {};

    data.forEach(team=>{

        stats[team.team.id] =
            team.statistics || [];

    });

    const homeStats =
        stats[data[0].team.id] || [];

    const awayStats =
        data[1]
        ? stats[data[1].team.id] || []
        : [];

    let html =
        `<div class="detail-section">
            <b>📊 Match Statistics</b>`;

    homeStats.forEach((item,i)=>{

        const name =
            item.type;

        const home =
            parseStat(item.value);

        const away =
            parseStat(
                awayStats[i]?.value
            );

        let total=home+away;

        let percentage =
            total
            ? (home/total)*100
            : 50;

        if(
            name.toLowerCase()
            .includes("possession")
        ){

            percentage =
                parseFloat(
                    String(item.value)
                    .replace("%","")
                );

        }

        html += `
            <div class="stat">

                <div class="stat-head">

                    <span>${esc(name)}</span>

                    <span>
                        ${esc(String(item.value || "-"))}
                        -
                        ${esc(String(awayStats[i]?.value || "-"))}
                    </span>

                </div>

                <div class="bar">
                    <div class="bar-inner"
                         style="width:${percentage}%">
                    </div>
                </div>

            </div>
        `;
    });

    html+="</div>";

    body.innerHTML=html;
}

function parseStat(v){

    if(v===null || v===undefined)
        return 0;

    const n =
        parseFloat(
            String(v).replace("%","")
        );

    return isNaN(n)?0:n;
}


/* =====================================================
   LINEUPS
===================================================== */

async function loadLineups(){

    const data =
        await api(
            "/fixtures/lineups?fixture="+
            currentFixture
        );

    const body =
        document.getElementById("detailBody");

    if(!data.length){

        body.innerHTML=
            `<div class="detail-section">
                👥 Lineups are not available
                for this match.
             </div>`;

        return;
    }

    let html="";

    data.forEach(team=>{

        html+=`
        <div class="detail-section">

            <b>👥 ${esc(team.team.name)}</b>

            <p style="font-size:11px;color:#777">
                Formation:
                ${esc(team.formation || "N/A")}
            </p>
        `;

        (team.startXI || [])
        .forEach(p=>{

            html+=`
                <div class="lineup">
                    ${esc(p.player?.name || "")}
                    <span style="float:right">
                        #${esc(
                            String(
                                p.player?.number || ""
                            )
                        )}
                    </span>
                </div>
            `;
        });

        html+="</div>";
    });

    body.innerHTML=html;
}


/* =====================================================
   TIME
===================================================== */

function formatTime(date){

    return new Intl.DateTimeFormat(
        "en-NG",
        {
            timeZone:"Africa/Lagos",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    ).format(new Date(date));
}

function formatDateTime(date){

    return new Intl.DateTimeFormat(
        "en-NG",
        {
            timeZone:"Africa/Lagos",
            dateStyle:"medium",
            timeStyle:"short"
        }
    ).format(new Date(date));
}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

    if(value===null ||
       value===undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
