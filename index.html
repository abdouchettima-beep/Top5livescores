<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0b0b0b">

<title>Top 5 Leagues - Live Scores</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

/* ================= HEADER ================= */

.header {
    background: linear-gradient(90deg, #11a36a, #0785ff);
    padding: 15px 10px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 50;
}

/* ================= AD ================= */

.ad {
    margin: 10px auto;
    max-width: 360px;
    height: 60px;
    background: #202020;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 12px;
}

/* ================= LEAGUES ================= */

.leagues {
    display: flex;
    overflow-x: auto;
    gap: 7px;
    padding: 10px;
    background: #111;
}

.leagues::-webkit-scrollbar {
    display: none;
}

.league-btn {
    flex: 0 0 auto;
    border: none;
    background: #292929;
    color: #fff;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.league-btn.active {
    background: #168cff;
}

/* ================= TABS ================= */

.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 8px;
}

.tab {
    border: none;
    background: #292929;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.tab.active {
    background: #168cff;
}

/* ================= REFRESH ================= */

.refresh-box {
    text-align: center;
    padding: 5px 0 10px;
}

.refresh {
    border: none;
    background: #333;
    color: white;
    padding: 9px 18px;
    border-radius: 20px;
    font-weight: bold;
}

/* ================= TITLE ================= */

.section-title {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0 12px;
}

/* ================= LOADING ================= */

.loading {
    text-align: center;
    padding: 35px 10px;
    color: #aaa;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #333;
    border-top: 4px solid #168cff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 15px;
}

@keyframes spin {

    100% {
        transform: rotate(360deg);
    }

}

/* ================= ERROR ================= */

.error {
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #421818;
    color: #ff9a9a;
    text-align: center;
}

/* ================= EMPTY ================= */

.empty {
    margin: 15px;
    padding: 25px 15px;
    background: #1b1b1b;
    border-radius: 10px;
    text-align: center;
    color: #999;
}

/* ================= MATCH CARD ================= */

.match {
    margin: 10px;
    padding: 13px;
    background: #1c1c1c;
    border-radius: 11px;
    border-left: 4px solid #168cff;
    cursor: pointer;
    transition: transform .15s;
}

.match:active {
    transform: scale(.98);
}

.match.live {
    border-left-color: #ff3030;
}

.match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.league-name {
    color: #42aaff;
    font-size: 13px;
    font-weight: bold;
}

.match-status {
    font-size: 11px;
    font-weight: bold;
    color: #aaa;
}

.live-status {
    color: #ff4242;
}

.team-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
}

.team {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 75%;
    font-size: 14px;
    font-weight: bold;
}

.team img {
    width: 30px;
    height: 30px;
    object-fit: contain;
}

.score {
    width: 25%;
    text-align: right;
    font-size: 19px;
    font-weight: bold;
}

.time {
    text-align: center;
    color: #ffc107;
    font-size: 13px;
    font-weight: bold;
    margin: 8px 0;
}

.venue {
    text-align: center;
    color: #777;
    font-size: 10px;
    margin-top: 8px;
}

.tap-details {
    text-align: center;
    margin-top: 10px;
    color: #777;
    font-size: 10px;
}

/* ================= DETAILS PAGE ================= */

#detailsPage {
    display: none;
    min-height: 100vh;
    background: #0b0b0b;
}

.details-top {
    background: linear-gradient(90deg, #11a36a, #0785ff);
    padding: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.back-btn {
    border: none;
    background: rgba(0,0,0,.25);
    color: white;
    padding: 9px 14px;
    border-radius: 20px;
    font-weight: bold;
}

.details-league {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    opacity: .9;
}

.details-status {
    text-align: center;
    margin-top: 5px;
    font-size: 12px;
    font-weight: bold;
}

/* ================= SCORE HEADER ================= */

.score-header {
    background: #151515;
    padding: 20px 10px;
    text-align: center;
}

.teams-details {
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.team-detail {
    width: 38%;
    font-weight: bold;
    font-size: 14px;
}

.team-detail img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    display: block;
    margin: auto auto 8px;
}

.detail-score {
    width: 24%;
    font-size: 27px;
    font-weight: bold;
}

.detail-time {
    color: #ffc107;
    font-size: 13px;
    margin-top: 10px;
}

/* ================= DETAIL NAV ================= */

.detail-nav {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px;
    background: #111;
}

.detail-nav::-webkit-scrollbar {
    display: none;
}

.detail-tab {
    flex: 0 0 auto;
    border: none;
    background: #292929;
    color: white;
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: bold;
}

.detail-tab.active {
    background: #168cff;
}

/* ================= DETAIL CONTENT ================= */

.detail-content {
    padding: 10px;
}

.info-box {
    background: #181818;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
}

.info-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* ================= EVENTS ================= */

.event {
    display: flex;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid #292929;
}

.event:last-child {
    border-bottom: none;
}

.event-minute {
    width: 45px;
    color: #42aaff;
    font-weight: bold;
    font-size: 12px;
}

.event-icon {
    width: 35px;
    font-size: 17px;
}

.event-text {
    flex: 1;
    font-size: 13px;
}

.event-team {
    color: #888;
    font-size: 10px;
    margin-top: 3px;
}

/* ================= STATISTICS ================= */

.stat-row {
    margin: 14px 0;
}

.stat-numbers {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 13px;
}

.stat-name {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin: 5px 0;
}

.stat-bars {
    display: flex;
    gap: 3px;
}

.stat-home,
.stat-away {
    height: 5px;
    background: #168cff;
    border-radius: 5px;
}

.stat-away {
    background: #555;
}

/* ================= LINEUPS ================= */

.lineup-team {
    background: #202020;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.lineup-team h3 {
    margin-top: 0;
    font-size: 14px;
}

.player {
    display: flex;
    justify-content: space-between;
    padding: 8px 3px;
    border-bottom: 1px solid #2b2b2b;
    font-size: 12px;
}

.player:last-child {
    border-bottom: none;
}

/* ================= H2H ================= */

.h2h-match {
    display: flex;
    justify-content: space-between;
    padding: 10px 3px;
    border-bottom: 1px solid #292929;
    font-size: 12px;
}

.h2h-date {
    color: #777;
    width: 22%;
}

.h2h-teams {
    width: 58%;
    text-align: center;
}

.h2h-score {
    width: 20%;
    text-align: right;
    font-weight: bold;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    padding: 25px 10px;
}

</style>

</head>

<body>


<!-- =====================================================
     FIXTURES PAGE
===================================================== -->

<div id="fixturesPage">

    <div class="header">
        ⚽ Top 5 Leagues - Live Scores
    </div>

    <div class="ad">
        AdMob Banner
    </div>


    <div class="leagues">

        <button class="league-btn active"
        onclick="selectLeague('all', this)">
            🌍 All
        </button>

        <button class="league-btn"
        onclick="selectLeague('39', this)">
            🏴 Premier League
        </button>

        <button class="league-btn"
        onclick="selectLeague('140', this)">
            🇪🇸 La Liga
        </button>

        <button class="league-btn"
        onclick="selectLeague('135', this)">
            🇮🇹 Serie A
        </button>

        <button class="league-btn"
        onclick="selectLeague('78', this)">
            🇩🇪 Bundesliga
        </button>

        <button class="league-btn"
        onclick="selectLeague('61', this)">
            🇫🇷 Ligue 1
        </button>

        <button class="league-btn"
        onclick="selectLeague('2', this)">

        onclick="loadMatches(true)">

        🔴 Live Matches

        <div class="loading">

            <div class="spinner"></div>

            Loading football matches...

        </div>

    </div>


    <div class="footer">

        Top 5 LiveScore<br>
        Powered by API-Football

    </div>

</div>


<!-- =====================================================
     MATCH DETAILS PAGE
===================================================== -->

<div id="detailsPage">

    <div class="details-top">

        <button class="back-btn"
        onclick="closeDetails()">

            ← Back

        </button>

        <div class="details-league"
        id="detailsLeague">

        </div>

        <div class="details-status"
        id="detailsStatus">

        </div>

    </div>


    <div class="score-header">

        <div class="teams-details">

            <div class="team-detail">

                <img id="detailHomeLogo">

                <div id="detailHomeName">
                </div>

            </div>


            <div class="detail-score">

                <span id="detailHomeScore">-</span>

                &nbsp;:&nbsp;

                <span id="detailAwayScore">-</span>

                <div class="detail-time"
                id="detailTime">

                </div>

            </div>


            <div class="team-detail">

                <img id="detailAwayLogo">

                <div id="detailAwayName">
                </div>

            </div>

        </div>

    </div>


    <div class="detail-nav">

        <button class="detail-tab active"
        onclick="changeDetailTab('events', this)">
            📝 Commentary
        </button>

        <button class="detail-tab"
        onclick="changeDetailTab('stats', this)">
            📊 Statistics
        </button>

        <button class="detail-tab"
        onclick="changeDetailTab('lineups', this)">
            👥 Lineups
        </button>

        <button class="detail-tab"
        onclick="changeDetailTab('h2h', this)">
            🆚 H2H
        </button>

    </div>


    <div class="detail-content"
    id="detailContent">

        <div class="loading">

            <div class="spinner"></div>

            Loading match information...

        </div>

    </div>


    <div class="footer">

        Powered by API-Football

    </div>

</div>


<script>

/* =====================================================
   API CONFIGURATION
===================================================== */

const API_KEY = "b6ada9c0192ddae9cb4d6f7812da6058KEY";

const API_URL =
"https://v3.football.api-sports.io";


/* =====================================================
   LEAGUES
===================================================== */

const LEAGUES = {

    "39": "Premier League",
    "140": "La Liga",
    "135": "Serie A",
    "78": "Bundesliga",
    "61": "Ligue 1",
    "2": "Champions League"

};


/* =====================================================
   APP STATE
===================================================== */

let selectedLeague = "all";

let selectedTab = "live";

let todayMatches = [];

let liveMatches = [];

let currentMatch = null;

let currentDetailTab = "events";

let liveRefreshTimer = null;


/* =====================================================
   TODAY
===================================================== */

function getToday() {

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Africa/Lagos",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).formatToParts(new Date());

    const year =
        parts.find(p => p.type === "year").value;

    const month =
        parts.find(p => p.type === "month").value;

    const day =
        parts.find(p => p.type === "day").value;

    return `${year}-${month}-${day}`;

}


/* =====================================================
   API REQUEST
===================================================== */

async function apiRequest(endpoint) {

    const response =
        await fetch(
            API_URL + endpoint,
            {
                method: "GET",
                headers: {
                    "x-apisports-key": API_KEY
                }
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            "HTTP Error " + response.status
        );

    }

    if (
        data.errors &&
        Object.keys(data.errors).length
    ) {

        throw new Error(
            JSON.stringify(data.errors)
        );

    }

    return data.response || [];

}


/* =====================================================
   LOAD TODAY
===================================================== */

async function loadTodayFixtures() {

    const today = getToday();

    todayMatches =
        await apiRequest(
            `/fixtures?date=${today}&timezone=Africa/Lagos`
        );

}


/* =====================================================
   LOAD LIVE
===================================================== */

async function loadLiveFixtures() {

    liveMatches =
        await apiRequest(
            `/fixtures?live=all&timezone=Africa/Lagos`
        );

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(force = false) {

    const container =
        document.getElementById("matches");

    container.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading matches...

        </div>

    `;

    try {

        await loadTodayFixtures();

        if (selectedTab === "live") {

            await loadLiveFixtures();

        }

        renderMatches();

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ API request failed.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =====================================================
   FILTER LEAGUE
===================================================== */

function filterLeague(matches) {

    if (selectedLeague === "all") {

        return matches.filter(match =>

            LEAGUES[
                String(match.league.id)
            ]

        );

    }

    return matches.filter(match =>

        String(match.league.id) ===
        String(selectedLeague)

    );

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches() {

    const container =
        document.getElementById("matches");

    let matches = [];


    if (selectedTab === "live") {

        matches =
            filterLeague(liveMatches);

    }

    else if (selectedTab === "upcoming") {

        matches =
            filterLeague(todayMatches)
            .filter(match =>

                [
                    "NS",
                    "TBD"
                ].includes(
                    match.fixture.status.short
                )

            );

    }

    else {

        matches =
            filterLeague(todayMatches)
            .filter(match =>

                [
                    "FT",
                    "AET",
                    "PEN"
                ].includes(
                    match.fixture.status.short
                )

            );

    }


    matches.sort((a, b) =>

        new Date(a.fixture.date) -
        new Date(b.fixture.date)

    );


    if (!matches.length) {

        container.innerHTML = `

            <div class="empty">

                ${
                    selectedTab === "live"
                    ? "🔴 No live matches right now."
                    : selectedTab === "upcoming"
                    ? "📅 No upcoming matches today."
                    : "✅ No finished matches today."
                }

                <br><br>

                Try another league or refresh.

            </div>

        `;

        return;

    }


    container.innerHTML =
        matches
        .map(createMatchCard)
        .join("");

}


/* =====================================================
   MATCH CARD
===================================================== */

function createMatchCard(match) {

    const fixture = match.fixture;

    const league = match.league;

    const teams = match.teams;

    const goals = match.goals;

    const status = fixture.status;

    const isLive =
        [
            "1H",
            "HT",
            "2H",
            "ET",
            "BT",
            "P"
        ].includes(status.short);


    let statusText =
        status.short;


    if (isLive) {

        statusText =
            status.elapsed
            ? `${status.elapsed}'`
            : "LIVE";

    }


    let matchTime = "";

    if (status.short === "NS") {

        matchTime =
            formatTime(fixture.date);

    }


    const homeScore =
        goals.home ?? "-";

    const awayScore =
        goals.away ?? "-";


    const venue =
        fixture.venue &&
        fixture.venue.name
        ? fixture.venue.name
        : "";


    return `

        <div class="match ${isLive ? "live" : ""}"
        onclick="openMatch(${match.fixture.id})">

            <div class="match-header">

                <div class="league-name">

                    ${escapeHTML(
                        league.name
                    )}

                </div>

                <div class="
                    match-status
                    ${isLive ? "live-status" : ""}
                ">

                    ${
                        isLive
                        ? "🔴 " + statusText
                        : statusText
                    }

                </div>

            </div>


            ${
                matchTime
                ? `
                    <div class="time">

                        ⏰ ${matchTime}

                    </div>
                `
                : ""
            }


            <div class="team-row">

                <div class="team">

                    ${
                        teams.home.logo
                        ? `
                            <img
                            src="${teams.home.logo}"
                            alt=""
                            >
                        `
                        : ""
                    }

                    <span>
                        ${escapeHTML(
                            teams.home.name
                        )}
                    </span>

                </div>

                <div class="score">

                    ${homeScore}

                </div>

            </div>


            <div class="team-row">

                <div class="team">

                    ${
                        teams.away.logo
                        ? `
                            <img
                            src="${teams.away.logo}"
                            alt=""
                            >
                        `
                        : ""
                    }

                    <span>
                        ${escapeHTML(
                            teams.away.name
                        )}
                    </span>

                </div>

                <div class="score">

                    ${awayScore}

                </div>

            </div>


            ${
                venue
                ? `
                    <div class="venue">

                        🏟️ ${escapeHTML(venue)}

                    </div>
                `
                : ""
            }


            <div class="tap-details">

                👆 Tap for match details

            </div>

        </div>

    `;

}


/* =====================================================
   OPEN MATCH
===================================================== */

async function openMatch(matchId) {

    const allMatches =
        [
            ...todayMatches,
            ...liveMatches
        ];

    currentMatch =
        allMatches.find(
            match =>
                String(match.fixture.id) ===
                String(matchId)
        );


    if (!currentMatch) {

        return;

    }


    document.getElementById(
        "fixturesPage"
    ).style.display = "none";


    document.getElementById(
        "detailsPage"
    ).style.display = "block";


    window.scrollTo(0, 0);


    showMatchHeader();

    currentDetailTab = "events";

    document
        .querySelectorAll(".detail-tab")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .querySelector(".detail-tab")
        .classList.add("active");


    await loadDetailContent();

}


/* =====================================================
   MATCH HEADER
===================================================== */

function showMatchHeader() {

    const match = currentMatch;

    const fixture = match.fixture;

    const teams = match.teams;

    const goals = match.goals;

    const status = fixture.status;


    document.getElementById(
        "detailsLeague"
    ).innerHTML =
        escapeHTML(match.league.name);


    document.getElementById(
        "detailsStatus"
    ).innerHTML =
        status.short;


    document.getElementById(
        "detailHomeName"
    ).innerHTML =
        escapeHTML(teams.home.name);


    document.getElementById(
        "detailAwayName"
    ).innerHTML =
        escapeHTML(teams.away.name);


    document.getElementById(
        "detailHomeLogo"
    ).src =
        teams.home.logo || "";


    document.getElementById(
        "detailAwayLogo"
    ).src =
        teams.away.logo || "";


    document.getElementById(
        "detailHomeScore"
    ).innerHTML =
        goals.home ?? "-";


    document.getElementById(
        "detailAwayScore"
    ).innerHTML =
        goals.away ?? "-";


    if (status.elapsed) {

        document.getElementById(
            "detailTime"
        ).innerHTML =
            status.elapsed + "'";

    }

    else if (status.short === "NS") {

        document.getElementById(
            "detailTime"
        ).innerHTML =
            formatTime(fixture.date);

    }

    else {

        document.getElementById(
            "detailTime"
        ).innerHTML =
            status.short;

    }

}


/* =====================================================
   DETAIL TAB
===================================================== */

function changeDetailTab(tab, button) {

    currentDetailTab = tab;


    document
        .querySelectorAll(".detail-tab")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    loadDetailContent();

}


/* =====================================================
   LOAD DETAIL CONTENT
===================================================== */

async function loadDetailContent() {

    const content =
        document.getElementById(
            "detailContent"
        );


    content.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading information...

        </div>

    `;


    try {

        if (currentDetailTab === "events") {

            await loadEvents();

        }

        else if (currentDetailTab === "stats") {

            await loadStatistics();

        }

        else if (currentDetailTab === "lineups") {

            await loadLineups();

        }

        else if (currentDetailTab === "h2h") {

            await loadH2H();

        }

    }

    catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="error">

                ❌ Unable to load this information.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =====================================================
   EVENTS / COMMENTARY
===================================================== */

async function loadEvents() {

    const events =
        await apiRequest(
            `/fixtures/events?fixture=${currentMatch.fixture.id}`
        );


    const content =
        document.getElementById(
            "detailContent"
        );


    if (!events.length) {

        content.innerHTML = `

            <div class="empty">

                📝 No commentary or events
                are available for this match yet.

            </div>

        `;

        return;

    }


    content.innerHTML = `

        <div class="info-box">

            <div class="info-title">

                📝 Match Commentary

            </div>

            ${events.map(event => {

                let icon = "ℹ️";

                if (event.type === "Goal") {

                    icon = "⚽";

                }

                else if (event.type === "Card") {

                    if (
                        event.detail &&
                        event.detail
                        .toLowerCase()
                        .includes("red")
                    ) {

                        icon = "🟥";

                    }

                    else {

                        icon = "🟨";

                    }

                }

                else if (
                    event.type === "subst"
                ) {

                    icon = "🔄";

                }


                const minute =
                    event.time &&
                    event.time.elapsed != null
                    ? event.time.elapsed + "'"
                    : "";


                const player =
                    event.player &&
                    event.player.name
                    ? event.player.name
                    : "";


                const assist =
                    event.assist &&
                    event.assist.name
                    ? event.assist.name
                    : "";


                let text =
                    event.detail ||
                    event.type ||
                    "Match event";


                return `

                    <div class="event">

                        <div class="event-minute">

                            ${minute}

                        </div>

                        <div class="event-icon">

                            ${icon}

                        </div>

                        <div class="event-text">

                            ${escapeHTML(text)}

                            ${
                                player
                                ? `
                                    <div class="event-team">

                                        ${escapeHTML(player)}

                                        ${
                                            assist
                                            ? " • Assist: " +
                                              escapeHTML(assist)
                                            : ""
                                        }

                                    </div>
                                `
                                : ""
                            }

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =====================================================
   STATISTICS
===================================================== */

async function loadStatistics() {

    const stats =
        await apiRequest(
            `/fixtures/statistics?fixture=${currentMatch.fixture.id}`
        );


    const content =
        document.getElementById(
            "detailContent"
        );


    if (
        !stats ||
        stats.length < 1
    ) {

        content.innerHTML = `

            <div class="empty">

                📊 Statistics are not
                available for this match yet.

            </div>

        `;

        return;

    }


    const homeStats =
        stats[0].statistics || [];


    const awayStats =
        stats[1] &&
        stats[1].statistics
        ? stats[1].statistics
        : [];


    let html = `

        <div class="info-box">

            <div class="info-title">

                📊 Match Statistics

            </div>

    `;


    const names = new Set();


    homeStats.forEach(stat =>
        names.add(stat.type)
    );


    awayStats.forEach(stat =>
        names.add(stat.type)
    );


    names.forEach(name => {

        const home =
            homeStats.find(
                stat => stat.type === name
            );


        const away =
            awayStats.find(
                stat => stat.type === name
            );


        const homeValue =
            home ? home.value : "-";


        const awayValue =
            away ? away.value : "-";


        html += `

            <div class="stat-row">

                <div class="stat-numbers">

                    <span>
                        ${formatStat(homeValue)}
                    </span>

                    <span>
                        ${formatStat(awayValue)}
                    </span>

                </div>


                <div class="stat-name">

                    ${escapeHTML(name)}

                </div>

            </div>

        `;

    });


    html += `</div>`;


    content.innerHTML = html;

}


/* =====================================================
   LINEUPS
===================================================== */

async function loadLineups() {

    const lineups =
        await apiRequest(
            `/fixtures/lineups?fixture=${currentMatch.fixture.id}`
        );


    const content =
        document.getElementById(
            "detailContent"
        );


    if (!lineups.length) {

        content.innerHTML = `

            <div class="empty">

                👥 Lineups are not available yet.

            </div>

        `;

        return;

    }


    let html = "";


    lineups.forEach(team => {

        html += `

            <div class="lineup-team">

                <h3>

                    👥 ${escapeHTML(
                        team.team.name
                    )}

                </h3>

        `;


        if (
            team.startXI &&
            team.startXI.length
        ) {

            html += `

                <div style="
                    color:#42aaff;
                    font-size:11px;
                    margin-bottom:6px;
                ">

                    Starting XI

                </div>

            `;


            team.startXI.forEach(player => {

                html += `

                    <div class="player">

                        <span>

                            ${escapeHTML(
                                player.player.name
                            )}

                        </span>

                        <span>

                            #${player.player.number ?? ""}

                            &nbsp;

                            ${player.player.pos || ""}

                        </span>

                    </div>

                `;

            });

        }


        if (
            team.substitutes &&
            team.substitutes.length
        ) {

            html += `

                <div style="
                    color:#42aaff;
                    font-size:11px;
                    margin-top:12px;
                    margin-bottom:6px;
                ">

                    Substitutes

                </div>

            `;


            team.substitutes.forEach(player => {

                html += `

                    <div class="player">

                        <span>

                            ${escapeHTML(
                                player.player.name
                            )}

                        </span>

                        <span>

                            #${player.player.number ?? ""}

                        </span>

                    </div>

                `;

            });

        }


        html += `</div>`;

    });


    content.innerHTML = html;

}


/* =====================================================
   HEAD TO HEAD
===================================================== */

async function loadH2H() {

    const homeId =
        currentMatch.teams.home.id;


    const awayId =
        currentMatch.teams.away.id;


    const h2h =
        await apiRequest(
            `/fixtures/headtohead?h2h=${homeId}-${awayId}&last=10`
        );


    const content =
        document.getElementById(
            "detailContent"
        );


    if (!h2h.length) {

        content.innerHTML = `

            <div class="empty">

                🆚 No previous meetings
                available.

            </div>

        `;

        return;

    }


    let html = `

        <div class="info-box">

            <div class="info-title">

                🆚 Head-to-Head

            </div>

    `;


    h2h.forEach(match => {

        html += `

            <div class="h2h-match">

                <div class="h2h-date">

                    ${formatDate(
                        match.fixture.date
                    )}

                </div>


                <div class="h2h-teams">

                    ${escapeHTML(
                        match.teams.home.name
                    )}

                    <br>

                    ${escapeHTML(
                        match.teams.away.name
                    )}

                </div>


                <div class="h2h-score">

                    ${
                        match.goals.home ?? "-"
                    }

                    <br>

                    ${
                        match.goals.away ?? "-"
                    }

                </div>

            </div>

        `;

    });


    html += `</div>`;


    content.innerHTML = html;

}


/* =====================================================
   CLOSE DETAILS
===================================================== */

function closeDetails() {

    document.getElementById(
        "detailsPage"
    ).style.display = "none";


    document.getElementById(
        "fixturesPage"
    ).style.display = "block";


    window.scrollTo(0, 0);

}


/* =====================================================
   LEAGUE
===================================================== */

function selectLeague(id, button) {

    selectedLeague = id;


    document
        .querySelectorAll(".league-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    renderMatches();

}


/* =====================================================
   MAIN TABS
===================================================== */

function changeTab(tab, button) {

    selectedTab = tab;


    document
        .querySelectorAll(".tab")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    const title =
        document.getElementById(
            "sectionTitle"
        );


    if (tab === "live") {

        title.innerHTML =
            "🔴 Live Matches";

    }

    else if (tab === "upcoming") {

        title.innerHTML =
            "📅 Upcoming Matches";

    }

    else {

        title.innerHTML =
            "✅ Finished Matches";

    }


    loadMatches();

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(dateString) {

    return new Intl.DateTimeFormat(

        "en-NG",

        {

            timeZone: "Africa/Lagos",

            hour: "2-digit",

            minute: "2-digit",

            hour12: true

        }

    ).format(
        new Date(dateString)
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(dateString) {

    return new Intl.DateTimeFormat(

        "en-NG",

        {

            timeZone: "Africa/Lagos",

            day: "2-digit",

            month: "short"

        }

    ).format(
        new Date(dateString)
    );

}


/* =====================================================
   FORMAT STAT
===================================================== */

function formatStat(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "-";

    }

    return String(value);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   AUTOMATIC LIVE REFRESH
===================================================== */

function startLiveRefresh() {

    if (liveRefreshTimer) {

        clearInterval(
            liveRefreshTimer
        );

    }


    liveRefreshTimer =
        setInterval(async () => {

            if (
                selectedTab === "live" &&
                document.getElementById(
                    "fixturesPage"
                ).style.display !== "none"
            ) {

                try {

                    await loadLiveFixtures();

                    renderMatches();

                }

                catch (error) {

                    console.log(
                        "Live refresh error",
                        error
                    );

                }

            }

        }, 30000);

}


/* =====================================================
   START
===================================================== */

loadMatches();

startLiveRefresh();

</script>
