<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 5 Leagues - Live Scores</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#090909;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    background:linear-gradient(90deg,#12a86b,#1598ff);
    padding:16px 10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.ad{
    margin:18px auto;
    max-width:560px;
    height:100px;
    background:#202020;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
}

.status{
    max-width:700px;
    margin:15px auto;
    padding:15px;
    text-align:center;
    border-radius:12px;
    background:#151515;
    font-size:17px;
}

.controls{
    padding:8px;
    overflow-x:auto;
    white-space:nowrap;
    text-align:center;
}

button{
    border:0;
    border-radius:25px;
    padding:13px 20px;
    margin:5px;
    background:#292929;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button.active{
    background:#168df5;
}

button:hover{
    background:#168df5;
}

.datebar{
    display:flex;
    overflow-x:auto;
    padding:10px;
    background:#171717;
    margin-top:10px;
}

.datebar button{
    min-width:120px;
}

.section-title{
    text-align:center;
    font-size:22px;
    margin:22px 0 12px;
}

.matches{
    max-width:900px;
    margin:auto;
    padding:0 8px 30px;
}

.match{
    background:#1d1d1d;
    border-radius:12px;
    margin:9px 0;
    padding:14px;
    border-left:4px solid #1598ff;
}

.league{
    color:#22a2ff;
    font-weight:bold;
    font-size:14px;
}

.country{
    color:#aaa;
    margin-top:4px;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:12px;
}

.team{
    width:35%;
    text-align:center;
    font-weight:bold;
}

.team img{
    width:38px;
    height:38px;
    object-fit:contain;
    display:block;
    margin:0 auto 6px;
}

.score{
    width:25%;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.time{
    color:#ffc400;
    text-align:center;
    margin-top:10px;
}

.statusText{
    color:#00e676;
    text-align:center;
    margin-top:8px;
}

.venue{
    color:#888;
    text-align:center;
    font-size:13px;
    margin-top:8px;
}

.error{
    background:#4b1717;
    color:#ff9c9c;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
    white-space:pre-wrap;
}

.loading{
    text-align:center;
    padding:25px;
    color:#bbb;
}

.empty{
    text-align:center;
    color:#999;
    padding:40px 10px;
}

.footer{
    text-align:center;
    color:#666;
    padding:30px 10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">
⚽ Top 5 Leagues - Live Scores
</div>

<div class="ad">
AdMob Banner
</div>

<div id="keyStatus" class="status">
⏳ Checking API key...
</div>

<div class="controls">

<button id="allBtn" class="active" onclick="selectLeague('all',this)">
🌐 All
</button>

<button onclick="selectLeague(39,this)">
🏴 Premier League
</button>

<button onclick="selectLeague(140,this)">
🇪🇸 La Liga
</button>

<button onclick="selectLeague(135,this)">
🇮🇹 Serie A
</button>

<button onclick="selectLeague(78,this)">
🇩🇪 Bundesliga
</button>

<button onclick="selectLeague(61,this)">
🇫🇷 Ligue 1
</button>

<button onclick="selectLeague(2,this)">
🏆 Champions League
</button>

</div>

<div class="controls">

<button id="liveBtn" onclick="showLive(this)">
🔴 Live
</button>

<button id="upcomingBtn" class="active" onclick="showUpcoming(this)">
📅 Upcoming
</button>

<button id="finishedBtn" onclick="showFinished(this)">
✅ Finished
</button>

</div>

<div class="controls">
<button onclick="refreshData()">🔄 Refresh</button>
</div>

<div id="dateBar" class="datebar"></div>

<div class="section-title" id="sectionTitle">
📅 Upcoming Matches
</div>

<div id="matches" class="matches">
<div class="loading">⏳ Loading matches...</div>
</div>

<div class="footer">
LiveScore Football<br>
Powered by API-Football
</div>

<script>

/* =====================================================
   PUT YOUR API KEY HERE
   ===================================================== */

const API_KEY = "a05da7373c97dd7f1b80f00df1748282";


/* =====================================================
   SETTINGS
   ===================================================== */

const API_URL = "https://v3.football.api-sports.io";

const LEAGUES = {
    39: "Premier League",
    140: "La Liga",
    135: "Serie A",
    78: "Bundesliga",
    61: "Ligue 1",
    2: "Champions League"
};

const SEASON = 2026;

let allFixtures = [];
let selectedLeague = "all";
let currentMode = "upcoming";
let selectedDate = getTodayString();


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function getTodayString(){

    const d = new Date();

    const year = d.getFullYear();
    const month = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function addDays(dateString, days){

    const d = new Date(dateString + "T12:00:00");

    d.setDate(d.getDate() + days);

    const year = d.getFullYear();
    const month = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function formatDate(dateString){

    const d = new Date(dateString + "T12:00:00");

    return d.toLocaleDateString("en-US",{
        weekday:"short",
        day:"numeric",
        month:"short"
    });
}


/* =====================================================
   API KEY CHECK
   ===================================================== */

function checkKey(){

    const box = document.getElementById("keyStatus");

    if(
        !API_KEY ||
        API_KEY === "PASTE_YOUR_API_KEY_HERE"
    ){

        box.innerHTML = "⚠️ API key has not been added.";
        return false;
    }

    box.innerHTML = "✅ API Key Loaded";
    return true;
}


/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(url){

    const response = await fetch(url,{
        method:"GET",
        headers:{
            "x-apisports-key":API_KEY
        }
    });

    const data = await response.json();

    if(data.errors && Object.keys(data.errors).length > 0){

        throw new Error(JSON.stringify(data.errors));
    }

    return data;
}


/* =====================================================
   LOAD ONE LEAGUE
   ===================================================== */

async function loadLeague(leagueId){

    const url =
        `${API_URL}/fixtures?league=${leagueId}&season=${SEASON}`;

    const data = await apiRequest(url);

    if(!data.response){
        return [];
    }

    return data.response;
}


/* =====================================================
   LOAD ALL LEAGUES
   ===================================================== */

async function loadAllFixtures(){

    if(!checkKey()){
        return;
    }

    const container = document.getElementById("matches");

    container.innerHTML =
        '<div class="loading">⏳ Loading fixtures...</div>';

    allFixtures = [];

    try{

        const leagueIds = Object.keys(LEAGUES);

        for(const leagueId of leagueIds){

            try{

                const fixtures =
                    await loadLeague(leagueId);

                allFixtures.push(...fixtures);

            }catch(error){

                console.log(
                    "League error:",
                    leagueId,
                    error
                );
            }
        }

        /* Remove duplicate fixtures */

        const unique = new Map();

        allFixtures.forEach(match=>{

            if(match.fixture && match.fixture.id){

                unique.set(
                    match.fixture.id,
                    match
                );
            }

        });

        allFixtures = Array.from(unique.values());

        allFixtures.sort(
            (a,b)=>
            new Date(a.fixture.date) -
            new Date(b.fixture.date)
        );

        createDateButtons();

        render();

    }catch(error){

        container.innerHTML =
            `<div class="error">❌ API Error\n\n${error.message}</div>`;
    }
}


/* =====================================================
   DATE BUTTONS
   ===================================================== */

function createDateButtons(){

    const bar = document.getElementById("dateBar");

    bar.innerHTML = "";

    for(let i=0;i<14;i++){

        const date = addDays(
            getTodayString(),
            i
        );

        const button =
            document.createElement("button");

        button.textContent =
            i === 0
            ? "Today"
            : i === 1
            ? "Tomorrow"
            : formatDate(date);

        if(date === selectedDate){
            button.classList.add("active");
        }

        button.onclick = function(){

            selectedDate = date;

            document
            .querySelectorAll(".datebar button")
            .forEach(b=>b.classList.remove("active"));

            this.classList.add("active");

            currentMode = "upcoming";

            render();
        };

        bar.appendChild(button);
    }
}


/* =====================================================
   LEAGUE SELECT
   ===================================================== */

function selectLeague(league,button){

    selectedLeague = league;

    document
    .querySelectorAll(".controls button")
    .forEach(b=>{

        if(
            b.parentElement.classList.contains("controls")
        ){
            b.classList.remove("active");
        }

    });

    button.classList.add("active");

    render();
}


/* =====================================================
   MODES
   ===================================================== */

function showLive(button){

    currentMode = "live";

    setModeButton(button);

    document.getElementById("dateBar").style.display="none";

    document.getElementById("sectionTitle").innerText =
        "🔴 Live Matches";

    loadLive();

}


function showUpcoming(button){

    currentMode = "upcoming";

    setModeButton(button);

    document.getElementById("dateBar").style.display="flex";

    document.getElementById("sectionTitle").innerText =
        "📅 Upcoming Matches";

    render();

}


function showFinished(button){

    currentMode = "finished";

    setModeButton(button);

    document.getElementById("dateBar").style.display="none";

    document.getElementById("sectionTitle").innerText =
        "✅ Finished Matches";

    render();

}


function setModeButton(button){

    document
    .querySelectorAll(".controls button")
    .forEach(b=>{

        b.classList.remove("active");

    });

    button.classList.add("active");
}


/* =====================================================
   LIVE MATCHES
   ===================================================== */

async function loadLive(){

    const container =
        document.getElementById("matches");

    container.innerHTML =
        '<div class="loading">🔴 Loading live matches...</div>';

    try{

        const data =
            await apiRequest(
                `${API_URL}/fixtures?live=all`
            );

        let matches = data.response || [];

        matches =
            filterLeague(matches);

        if(matches.length === 0){

            container.innerHTML =
                '<div class="empty">🔴 No live matches right now.</div>';

            return;
        }

        renderMatches(matches);

    }catch(error){

        container.innerHTML =
            `<div class="error">❌ API Error\n\n${error.message}</div>`;
    }
}


/* =====================================================
   FILTER LEAGUE
   ===================================================== */

function filterLeague(matches){

    if(selectedLeague === "all"){
        return matches;
    }

    return matches.filter(match =>
        String(match.league.id) ===
        String(selectedLeague)
    );
}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

    if(currentMode === "live"){
        return;
    }

    let matches = [...allFixtures];

    matches = filterLeague(matches);

    const today =
        getTodayString();

    if(currentMode === "upcoming"){

        matches = matches.filter(match=>{

            const date =
                match.fixture.date.substring(0,10);

            return (
                date === selectedDate &&
                !isFinished(match)
            );

        });

    }else{

        matches = matches.filter(match=>{

            const date =
                match.fixture.date.substring(0,10);

            return (
                date === today &&
                isFinished(match)
            );

        });

    }

    renderMatches(matches);
}


/* =====================================================
   FINISHED STATUS
   ===================================================== */

function isFinished(match){

    const status =
        match.fixture.status.short;

    return [
        "FT",
        "AET",
        "PEN"
    ].includes(status);
}


/* =====================================================
   RENDER MATCHES
   ===================================================== */

function renderMatches(matches){

    const container =
        document.getElementById("matches");

    container.innerHTML = "";

    if(matches.length === 0){

        container.innerHTML =
            '<div class="empty">No matches available for this selection.</div>';

        return;
    }

    matches.forEach(match=>{

        const fixture =
            match.fixture;

        const league =
            match.league;

        const teams =
            match.teams;

        const goals =
            match.goals;

        const status =
            fixture.status;

        const date =
            new Date(fixture.date);

        const card =
            document.createElement("div");

        card.className="match";

        let scoreText = "-";

        if(
            goals.home !== null &&
            goals.away !== null
        ){

            scoreText =
                `${goals.home} - ${goals.away}`;

        }

        let timeText =
            date.toLocaleTimeString(
                "en-US",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        if(isFinished(match)){

            timeText =
                `<span class="statusText">
                Status: ${status.long}
                </span>`;
        }

        card.innerHTML = `

        <div class="league">
            🏆 ${league.name}
        </div>

        <div class="country">
            ${league.country || ""}
        </div>

        <div class="teams">

            <div class="team">

                <img
                src="${teams.home.logo}"
                onerror="this.style.display='none'"
                >

                ${teams.home.name}

            </div>

            <div class="score">

                ${scoreText}

            </div>

            <div class="team">

                <img
                src="${teams.away.logo}"
                onerror="this.style.display='none'"
                >

                ${teams.away.name}

            </div>

        </div>

        <div class="time">
            ⏰ ${timeText}
        </div>

        ${
            fixture.venue &&
            fixture.venue.name
            ?
            `<div class="venue">
            🏟️ ${fixture.venue.name}
            </div>`
            :
            ""
        }

        `;

        container.appendChild(card);

    });

}


/* =====================================================
   REFRESH
   ===================================================== */

async function refreshData(){

    allFixtures=[];

    await loadAllFixtures();

    if(currentMode === "live"){

        await loadLive();

    }

}


/* =====================================================
   START APP
   ===================================================== */

checkKey();

loadAllFixtures();

</script>

</body>
</html>
