<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API-Football Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>⚽ API-Football Test</h2>

    <p>Click the button to test the API connection.</p>

    <button onclick="testAPI()">TEST API</button>

    <div id="result">Waiting for test...</div>
  </div>

  <script>

    const API_KEY = "b6ada9c0192ddae9cb4d6f7812da6058";

    async function testAPI() {

      const result = document.getElementById("result");

      result.innerHTML = "⏳ Testing API...";

      try {

        const response = await fetch(
          "https://v3.football.api-sports.io/countries",
          {
            method: "GET",
            headers: {
              "x-apisports-key": API_KEY
            }
          }
        );

        const data = await response.json();

        console.log(data);

        if (response.ok && data.response) {

          result.innerHTML =
            "✅ API CONNECTION SUCCESSFUL!\n\n" +
            "Countries received: " +
            data.response.length +
            "\n\n" +
            JSON.stringify(data, null, 2);

        } else {

          result.innerHTML =
            "❌ API ERROR\n\n" +
            "HTTP Status: " +
            response.status +
            "\n\n" +
            JSON.stringify(data, null, 2);
        }

      } catch (error) {

        result.innerHTML =
          "❌ REQUEST FAILED\n\n" +
          error.message;
      }
    }

  </script>

</body>
</html>
